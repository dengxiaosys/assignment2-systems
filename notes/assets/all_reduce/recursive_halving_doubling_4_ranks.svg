<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1040" width="1400" height="1040" role="img" aria-labelledby="title desc">
  <title id="title">Recursive halving reduce-scatter followed by recursive doubling all-gather with four ranks</title>
  <desc id="desc">Four panels show two reduce-scatter rounds with decreasing message sizes and two all-gather rounds with increasing message sizes.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f7f7f8; stroke: #d3d4da; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #d3d4da; stroke-width: 1.5; }
    .rs-node { fill: #e5fff2; stroke: #0fdc78; stroke-width: 2; }
    .ag-node { fill: #eef6ff; stroke: #80c1ff; stroke-width: 2; }
    .title { fill: #171717; font: 600 26px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .subtitle { fill: #52525b; font: 400 15px/1.3 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .panel-title { fill: #171717; font: 600 19px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .node-title { fill: #171717; font: 600 16px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .state { fill: #52525b; font: 500 13px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .rs-state { fill: #004d26; font: 600 13px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .ag-state { fill: #174a75; font: 600 13px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .label { fill: #52525b; font: 500 13px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .rs-arrow { fill: none; stroke: #0fdc78; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#rs-arrow); }
    .ag-arrow { fill: none; stroke: #80c1ff; stroke-width: 2.6; stroke-linecap: round; marker-end: url(#ag-arrow); }
  </style>
  <defs>
    <marker id="rs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0fdc78"/>
    </marker>
    <marker id="ag-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#80c1ff"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="1040"/>
  <text class="title" x="700" y="40" text-anchor="middle">Recursive halving + recursive doubling（P=4）</text>
  <text class="subtitle" x="700" y="68" text-anchor="middle">先 reduce-scatter：消息减半；再 all-gather：消息倍增</text>

  <!-- Reduce-scatter round 1 -->
  <g transform="translate(35 95)">
    <rect class="panel" width="645" height="400" rx="12"/>
    <text class="panel-title" x="26" y="36">RS Round 1 · 距离 2 · 每 rank 发送 S/2</text>
    <text class="subtitle" x="26" y="62">r0 ↔ r2，r1 ↔ r3；交换并保留不同的半区</text>
    <g transform="translate(35 92)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r0 keeps chunks 0–1</text>
      <text class="rs-state" x="16" y="51">[a0+c0, a1+c1]</text>
    </g>
    <g transform="translate(390 92)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r1 keeps chunks 0–1</text>
      <text class="rs-state" x="16" y="51">[b0+d0, b1+d1]</text>
    </g>
    <g transform="translate(35 278)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r2 keeps chunks 2–3</text>
      <text class="rs-state" x="16" y="51">[a2+c2, a3+c3]</text>
    </g>
    <g transform="translate(390 278)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r3 keeps chunks 2–3</text>
      <text class="rs-state" x="16" y="51">[b2+d2, b3+d3]</text>
    </g>
    <path class="rs-arrow" d="M130 164 V278"/>
    <path class="rs-arrow" d="M160 278 V164"/>
    <path class="rs-arrow" d="M485 164 V278"/>
    <path class="rs-arrow" d="M515 278 V164"/>
    <text class="label" x="182" y="225">exchange S/2</text>
    <text class="label" x="420" y="225" text-anchor="end">exchange S/2</text>
  </g>

  <!-- Reduce-scatter round 2 -->
  <g transform="translate(720 95)">
    <rect class="panel" width="645" height="400" rx="12"/>
    <text class="panel-title" x="26" y="36">RS Round 2 · 距离 1 · 每 rank 发送 S/4</text>
    <text class="subtitle" x="26" y="62">r0 ↔ r1，r2 ↔ r3；每个 rank 留下一个完整归约 chunk</text>
    <g transform="translate(35 92)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r0 owns y0</text>
      <text class="rs-state" x="16" y="51">a0+b0+c0+d0</text>
    </g>
    <g transform="translate(390 92)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r1 owns y1</text>
      <text class="rs-state" x="16" y="51">a1+b1+c1+d1</text>
    </g>
    <g transform="translate(35 278)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r2 owns y2</text>
      <text class="rs-state" x="16" y="51">a2+b2+c2+d2</text>
    </g>
    <g transform="translate(390 278)">
      <rect class="rs-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r3 owns y3</text>
      <text class="rs-state" x="16" y="51">a3+b3+c3+d3</text>
    </g>
    <path class="rs-arrow" d="M255 116 H390"/>
    <path class="rs-arrow" d="M390 144 H255"/>
    <path class="rs-arrow" d="M255 302 H390"/>
    <path class="rs-arrow" d="M390 330 H255"/>
    <text class="label" x="322" y="105" text-anchor="middle">exchange S/4</text>
    <text class="label" x="322" y="291" text-anchor="middle">exchange S/4</text>
  </g>

  <!-- All-gather round 1 -->
  <g transform="translate(35 525)">
    <rect class="panel" width="645" height="400" rx="12"/>
    <text class="panel-title" x="26" y="36">AG Round 1 · 距离 1 · 每 rank 发送 S/4</text>
    <text class="subtitle" x="26" y="62">r0 ↔ r1，r2 ↔ r3；每个 rank 收集两个结果 chunk</text>
    <g transform="translate(35 92)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r0</text>
      <text class="ag-state" x="16" y="51">[y0, y1]</text>
    </g>
    <g transform="translate(390 92)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r1</text>
      <text class="ag-state" x="16" y="51">[y0, y1]</text>
    </g>
    <g transform="translate(35 278)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r2</text>
      <text class="ag-state" x="16" y="51">[y2, y3]</text>
    </g>
    <g transform="translate(390 278)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r3</text>
      <text class="ag-state" x="16" y="51">[y2, y3]</text>
    </g>
    <path class="ag-arrow" d="M255 116 H390"/>
    <path class="ag-arrow" d="M390 144 H255"/>
    <path class="ag-arrow" d="M255 302 H390"/>
    <path class="ag-arrow" d="M390 330 H255"/>
    <text class="label" x="322" y="105" text-anchor="middle">y0 / y1</text>
    <text class="label" x="322" y="291" text-anchor="middle">y2 / y3</text>
  </g>

  <!-- All-gather round 2 -->
  <g transform="translate(720 525)">
    <rect class="panel" width="645" height="400" rx="12"/>
    <text class="panel-title" x="26" y="36">AG Round 2 · 距离 2 · 每 rank 发送 S/2</text>
    <text class="subtitle" x="26" y="62">r0 ↔ r2，r1 ↔ r3；所有 rank 收齐完整结果</text>
    <g transform="translate(35 92)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r0</text>
      <text class="ag-state" x="16" y="51">[y0, y1, y2, y3]</text>
    </g>
    <g transform="translate(390 92)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r1</text>
      <text class="ag-state" x="16" y="51">[y0, y1, y2, y3]</text>
    </g>
    <g transform="translate(35 278)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r2</text>
      <text class="ag-state" x="16" y="51">[y0, y1, y2, y3]</text>
    </g>
    <g transform="translate(390 278)">
      <rect class="ag-node" width="220" height="72" rx="8"/>
      <text class="node-title" x="16" y="26">r3</text>
      <text class="ag-state" x="16" y="51">[y0, y1, y2, y3]</text>
    </g>
    <path class="ag-arrow" d="M130 164 V278"/>
    <path class="ag-arrow" d="M160 278 V164"/>
    <path class="ag-arrow" d="M485 164 V278"/>
    <path class="ag-arrow" d="M515 278 V164"/>
    <text class="label" x="182" y="225">exchange [y0,y1] / [y2,y3]</text>
    <text class="label" x="462" y="225" text-anchor="end">exchange S/2</text>
  </g>

  <text class="subtitle" x="700" y="970" text-anchor="middle">每 rank 发送量：S/2 + S/4 + S/4 + S/2 = 3S/2 = 2(P−1)S/P</text>
  <text class="subtitle" x="700" y="999" text-anchor="middle">总阶段数：2 log2(P) = 4；绿色为 reduce-scatter，蓝色为 all-gather</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Binomial tree reduce followed by reverse broadcast with four ranks</title>
  <desc id="desc">The reduce phase first combines rank one into rank zero and rank three into rank two in parallel, then rank two into rank zero. Broadcast traverses the same tree in reverse.</desc>
  <style>
    .bg { fill: #ffffff; }
    .panel { fill: #f7f7f8; stroke: #d3d4da; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #d3d4da; stroke-width: 1.5; }
    .root { fill: #e5fff2; stroke: #0fdc78; stroke-width: 2.5; }
    .title { fill: #171717; font: 600 26px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .subtitle { fill: #52525b; font: 400 15px/1.3 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .panel-title { fill: #171717; font: 600 20px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .node-title { fill: #171717; font: 600 17px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .root-title { fill: #004d26; font: 600 17px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .state { fill: #52525b; font: 500 14px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .root-state { fill: #004d26; font: 600 14px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .round { fill: #004d26; font: 600 14px/1.2 "Source Han Sans SC", "Droid Sans Fallback", system-ui, sans-serif; }
    .label { fill: #52525b; font: 500 13px/1.2 ui-monospace, "SFMono-Regular", Consolas, monospace; }
    .arrow-one { fill: none; stroke: #0fdc78; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-one); }
    .arrow-two { fill: none; stroke: #52525b; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 5; marker-end: url(#arrow-two); }
    .chip-one { fill: #e5fff2; stroke: #0fdc78; stroke-width: 1; }
    .chip-two { fill: #ffffff; stroke: #d3d4da; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow-one" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0fdc78"/>
    </marker>
    <marker id="arrow-two" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525b"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="600" y="40" text-anchor="middle">Binomial tree reduce + reverse broadcast（P=4）</text>
  <text class="subtitle" x="600" y="68" text-anchor="middle">实线为第 1 轮，虚线为第 2 轮；同一轮中的多条边可以并行</text>

  <g transform="translate(35 95)">
    <rect class="panel" x="0" y="0" width="545" height="550" rx="12"/>
    <text class="panel-title" x="28" y="38">阶段 1：tree reduce</text>
    <text class="subtitle" x="28" y="64">partial sum 逐层向 root 汇聚</text>

    <g transform="translate(172 90)">
      <rect class="root" width="200" height="74" rx="8"/>
      <text class="root-title" x="100" y="28" text-anchor="middle">r0 · root</text>
      <text class="root-state" x="100" y="53" text-anchor="middle">y = x0+x1+x2+x3</text>
    </g>
    <g transform="translate(35 270)">
      <rect class="node" width="150" height="66" rx="8"/>
      <text class="node-title" x="75" y="27" text-anchor="middle">r1</text>
      <text class="state" x="75" y="50" text-anchor="middle">x1 · S byte</text>
    </g>
    <g transform="translate(360 270)">
      <rect class="node" width="150" height="66" rx="8"/>
      <text class="node-title" x="75" y="27" text-anchor="middle">r2</text>
      <text class="state" x="75" y="50" text-anchor="middle">x2+x3 · S byte</text>
    </g>
    <g transform="translate(360 425)">
      <rect class="node" width="150" height="66" rx="8"/>
      <text class="node-title" x="75" y="27" text-anchor="middle">r3</text>
      <text class="state" x="75" y="50" text-anchor="middle">x3 · S byte</text>
    </g>

    <path class="arrow-one" d="M110 270 C130 220 185 185 225 164"/>
    <path class="arrow-one" d="M435 425 V336"/>
    <path class="arrow-two" d="M400 270 C370 220 330 185 310 164"/>

    <rect class="chip-one" x="68" y="198" width="104" height="28" rx="8"/>
    <text class="round" x="120" y="217" text-anchor="middle">① r1 → r0</text>
    <rect class="chip-one" x="386" y="362" width="104" height="28" rx="8"/>
    <text class="round" x="438" y="381" text-anchor="middle">① r3 → r2</text>
    <rect class="chip-two" x="330" y="196" width="104" height="28" rx="8"/>
    <text class="label" x="382" y="215" text-anchor="middle">② r2 → r0</text>

    <text class="subtitle" x="272" y="520" text-anchor="middle">第 1 轮两条边并行；第 2 轮发送已归约的 x2+x3</text>
  </g>

  <g transform="translate(620 95)">
    <rect class="panel" x="0" y="0" width="545" height="550" rx="12"/>
    <text class="panel-title" x="28" y="38">阶段 2：reverse tree broadcast</text>
    <text class="subtitle" x="28" y="64">完整结果 y 沿同一棵树反向传播</text>

    <g transform="translate(172 90)">
      <rect class="root" width="200" height="74" rx="8"/>
      <text class="root-title" x="100" y="28" text-anchor="middle">r0 · root</text>
      <text class="root-state" x="100" y="53" text-anchor="middle">result y · S byte</text>
    </g>
    <g transform="translate(35 270)">
      <rect class="node" width="150" height="66" rx="8"/>
      <text class="node-title" x="75" y="27" text-anchor="middle">r1</text>
      <text class="state" x="75" y="50" text-anchor="middle">receives y</text>
    </g>
    <g transform="translate(360 270)">
      <rect class="node" width="150" height="66" rx="8"/>
      <text class="node-title" x="75" y="27" text-anchor="middle">r2</text>
      <text class="state" x="75" y="50" text-anchor="middle">receives y</text>
    </g>
    <g transform="translate(360 425)">
      <rect class="node" width="150" height="66" rx="8"/>
      <text class="node-title" x="75" y="27" text-anchor="middle">r3</text>
      <text class="state" x="75" y="50" text-anchor="middle">receives y</text>
    </g>

    <path class="arrow-two" d="M225 164 C185 185 130 220 110 270"/>
    <path class="arrow-one" d="M310 164 C330 185 370 220 400 270"/>
    <path class="arrow-two" d="M435 336 V425"/>

    <rect class="chip-two" x="68" y="198" width="104" height="28" rx="8"/>
    <text class="label" x="120" y="217" text-anchor="middle">② r0 → r1</text>
    <rect class="chip-one" x="330" y="196" width="104" height="28" rx="8"/>
    <text class="round" x="382" y="215" text-anchor="middle">① r0 → r2</text>
    <rect class="chip-two" x="386" y="362" width="104" height="28" rx="8"/>
    <text class="label" x="438" y="381" text-anchor="middle">② r2 → r3</text>

    <text class="subtitle" x="272" y="520" text-anchor="middle">第 1 轮先到 r2；第 2 轮 r0→r1 与 r2→r3 并行</text>
  </g>

  <line x1="390" y1="686" x2="438" y2="686" class="arrow-one" marker-end="none"/>
  <text class="subtitle" x="450" y="691">第 1 轮</text>
  <line x1="560" y1="686" x2="608" y2="686" class="arrow-two" marker-end="none"/>
  <text class="subtitle" x="620" y="691">第 2 轮</text>
</svg>

   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5b6470" x="32.0256" y="60.940312" transform="rotate(-0 32.0256 60.940312)">One query row, scalar values for illustration</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202124" x="80.1252" y="203.1765" transform="rotate(-0 80.1252 203.1765)">same query row i</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(74.098275 103.659562)">keys 1-2</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(66.7089 112.617812)">p=[0.1, 0.2]</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(69.423275 121.576062)">v=[10, 20]</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(74.098275 328.748062)">keys 3-4</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(66.7089 337.706312)">p=[0.3, 0.4]</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(69.423275 346.664562)">v=[30, 40]</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(257.2495 107.369812)">warp 0</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(227.20075 116.328062)">u0 = 0.1*10 + 0.2*20</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(263.803875 125.286312)">= 5</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(257.2495 325.037812)">warp 1</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(227.20075 333.996062)">u1 = 0.3*30 + 0.4*40</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(261.258875 342.954312)">= 25</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(426.6901 113.085687)">SMEM slot 0</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(423.2901 122.043937)">partial u0 = 5</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(426.6901 330.753687)">SMEM slot 1</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(420.7451 339.711937)">partial u1 = 25</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(582.35795 220.682937)">block barrier</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(575.368575 229.641187)">both slots ready</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(730.459375 220.682937)">reduce</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(728.155625 229.641187)">u0 + u1</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(856.696475 220.571687)">output</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(853.346475 229.529937)">o_i = 30</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #d55e00" x="472.68" y="402.283312" transform="rotate(-0 472.68 402.283312)">In the real kernel each partial is a Br x d output tile, not one scalar.</text>
   </g>
   <g id="text_13">

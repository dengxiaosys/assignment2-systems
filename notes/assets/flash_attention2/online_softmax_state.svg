   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(73.971984 101.833522)">Old state</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(66.305812 111.911553)">m_old, l_old,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(69.657609 122.239897)">O_tilde_old</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(76.171359 257.869078)">New tile</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(78.654797 267.947109)">S_j, V_j</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(269.569406 130.44706)">New maximum</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(269.362687 140.525091)">m_new = max(</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(257.523469 150.853435)">m_old, rowmax(S_j))</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(475.935328 101.958678)">Rescale old state</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(485.272125 112.036709)">alpha = exp(</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(478.676109 122.11474)">m_old - m_new)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(483.732984 252.704906)">Local weights</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(479.392594 262.782937)">P_tilde_j = exp(</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(485.812828 273.111281)">S_j - m_new)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(705.993156 144.318001)">Updated invariant</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(653.87675 154.955923)">l_new = alpha l_old + rowsum(P_tilde_j)</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202124" transform="translate(637.409836 165.858064)">O_tilde_new = alpha O_tilde_old + P_tilde_j V_j</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202124" x="443.4525" y="343.789197" transform="rotate(-0 443.4525 343.789197)">After the last tile:  O = O_tilde / l,    L = m + log(l)</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="17.837812" transform="rotate(-0 7.2 17.837812)">Online softmax: one key/value tile updates a row-wise invariant</text>
   </g>
  </g>

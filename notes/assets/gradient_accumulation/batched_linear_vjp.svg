<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">Batched linear layer forward and vector-Jacobian product</title>
  <desc id="desc">Activations keep batch and sequence axes, while the shared weight gradient sums contributions across all batch and sequence positions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7e22ce"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, sans-serif; fill: #475569; }
      .lane { font: 700 18px Inter, sans-serif; fill: #0f172a; }
      .box-title { font: 700 17px Inter, sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, sans-serif; fill: #334155; }
      .small { font: 400 13px Inter, sans-serif; fill: #475569; }
      .formula { font: 600 16px "DejaVu Sans Mono", monospace; fill: #0f172a; }
      .tag { font: 700 14px Inter, sans-serif; }
    </style>
  </defs>

  <rect width="1500" height="720" fill="#f8fafc"/>
  <text x="42" y="48" class="title">Batched Linear: activations keep B,S; the shared weight gradient reduces B,S</text>
  <text x="42" y="76" class="subtitle">For this operator, flatten the leading batch-like axes into N=B*S. PyTorch computes Y = X W^T.</text>

  <text x="42" y="151" class="lane">Forward</text>

  <rect x="180" y="108" width="240" height="96" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="300" y="140" text-anchor="middle" class="box-title">Activations X</text>
  <text x="300" y="168" text-anchor="middle" class="formula">shape [B, S, d_in]</text>
  <text x="300" y="190" text-anchor="middle" class="small">N=B*S token positions</text>

  <rect x="180" y="234" width="240" height="86" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="266" text-anchor="middle" class="box-title">One shared parameter W</text>
  <text x="300" y="294" text-anchor="middle" class="formula">shape [d_out, d_in]</text>

  <line x1="420" y1="156" x2="520" y2="156" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="420" y1="277" x2="470" y2="277" stroke="#2563eb" stroke-width="3"/>
  <line x1="470" y1="277" x2="470" y2="172" stroke="#2563eb" stroke-width="3"/>
  <line x1="470" y1="172" x2="520" y2="172" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="520" y="108" width="265" height="96" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="652" y="140" text-anchor="middle" class="box-title">Batched linear operator</text>
  <text x="652" y="168" text-anchor="middle" class="formula">Y_flat = X_flat W^T</text>
  <text x="652" y="190" text-anchor="middle" class="small">same W used at every (b,s)</text>

  <line x1="785" y1="156" x2="865" y2="156" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="865" y="108" width="240" height="96" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="985" y="140" text-anchor="middle" class="box-title">Output activations Y</text>
  <text x="985" y="168" text-anchor="middle" class="formula">shape [B, S, d_out]</text>
  <text x="985" y="190" text-anchor="middle" class="small">B,S axes are preserved</text>

  <line x1="1105" y1="156" x2="1190" y2="156" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1190" y="108" width="230" height="96" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="1305" y="140" text-anchor="middle" class="box-title">Scalar loss L</text>
  <text x="1305" y="168" text-anchor="middle" class="body">mean or sum reduction</text>
  <text x="1305" y="190" text-anchor="middle" class="small">backward seed: dL/dL = 1</text>

  <line x1="1305" y1="204" x2="1305" y2="342" stroke="#7e22ce" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <text x="42" y="410" class="lane">Reverse mode</text>

  <rect x="1120" y="350" width="300" height="104" rx="6" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="1270" y="381" text-anchor="middle" class="box-title">Upstream gradient G = dL/dY</text>
  <text x="1270" y="409" text-anchor="middle" class="formula">shape [B, S, d_out]</text>
  <text x="1270" y="434" text-anchor="middle" class="small">contains loss reduction factors</text>

  <line x1="1120" y1="402" x2="1030" y2="402" stroke="#7e22ce" stroke-width="3" marker-end="url(#arrow-purple)"/>

  <rect x="760" y="350" width="270" height="104" rx="6" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="895" y="381" text-anchor="middle" class="box-title">Linear VJP</text>
  <text x="895" y="409" text-anchor="middle" class="formula">J_linear^T * G</text>
  <text x="895" y="434" text-anchor="middle" class="small">no full Jacobian is materialized</text>

  <line x1="760" y1="382" x2="670" y2="382" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="760" y1="425" x2="670" y2="510" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="380" y="330" width="290" height="104" rx="6" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="525" y="361" text-anchor="middle" class="box-title">Activation gradient dX</text>
  <text x="525" y="389" text-anchor="middle" class="formula">G_flat W</text>
  <text x="525" y="414" text-anchor="middle" class="tag" fill="#0f766e">shape [B, S, d_in]</text>

  <rect x="380" y="460" width="290" height="116" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="491" text-anchor="middle" class="box-title">Parameter gradient dW</text>
  <text x="525" y="519" text-anchor="middle" class="formula">G_flat^T X_flat</text>
  <text x="525" y="544" text-anchor="middle" class="tag" fill="#b91c1c">shape [d_out, d_in]</text>
  <text x="525" y="565" text-anchor="middle" class="small">B,S are summed out</text>

  <rect x="42" y="590" width="1378" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="64" y="622" class="box-title">Per-position view</text>
  <text x="250" y="622" class="formula">dW = sum_(b,s) g_(b,s) x_(b,s)^T</text>
  <text x="64" y="653" class="body">The parameter has no B or S axis because every use of the same W contributes an outer product into one shared gradient buffer.</text>
  <text x="64" y="673" class="small">If loss is a mean over N valid tokens, the upstream gradients already carry the 1/N factor.</text>
</svg>

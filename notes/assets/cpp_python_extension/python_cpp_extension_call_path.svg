<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Python to C++ extension call path</title>
  <desc id="desc">A Python call crosses CPython and pybind11 before executing C++, then the result is converted back to a Python object.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7 Z" fill="#52525b"/>
    </marker>
    <marker id="arrow-focus" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4 L1 7 Z" fill="#0f8a4b"/>
    </marker>
    <style>
      .bg { fill: #f7f7f8; }
      .panel { fill: #ffffff; stroke: #d4d4d8; stroke-width: 2; }
      .focus { fill: #e5fff2; stroke: #0f8a4b; stroke-width: 3; }
      .external { fill: #eafbf8; stroke: #159b8c; stroke-width: 2; }
      .title { fill: #171717; font: 600 28px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .label { fill: #171717; font: 600 21px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .meta { fill: #52525b; font: 17px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .code { fill: #171717; font: 17px "JetBrains Mono", "SFMono-Regular", monospace; }
      .arrow { fill: none; stroke: #52525b; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); }
      .arrow-focus { fill: none; stroke: #0f8a4b; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow-focus); }
      .divider { stroke: #d4d4d8; stroke-width: 2; stroke-dasharray: 8 8; }
      .step { fill: #0f8a4b; font: 600 16px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="520" rx="16"/>
  <text class="title" x="50" y="52">How add(2, 3) crosses the Python/C++ boundary</text>
  <line class="divider" x1="600" y1="78" x2="600" y2="445"/>
  <text class="meta" x="300" y="102" text-anchor="middle">Python / CPython runtime</text>
  <text class="meta" x="900" y="102" text-anchor="middle">Native C++ runtime</text>

  <rect class="panel" x="55" y="145" width="220" height="120" rx="12"/>
  <text class="label" x="165" y="184" text-anchor="middle">Python call site</text>
  <text class="code" x="165" y="224" text-anchor="middle">add(2, 3)</text>
  <text class="meta" x="165" y="250" text-anchor="middle">two PyObject* values</text>

  <rect class="panel" x="345" y="145" width="220" height="120" rx="12"/>
  <text class="label" x="455" y="184" text-anchor="middle">CPython dispatch</text>
  <text class="meta" x="455" y="220" text-anchor="middle">resolve callable</text>
  <text class="meta" x="455" y="247" text-anchor="middle">pack args / track errors</text>

  <rect class="focus" x="635" y="145" width="220" height="120" rx="12"/>
  <text class="label" x="745" y="184" text-anchor="middle">pybind11 wrapper</text>
  <text class="meta" x="745" y="220" text-anchor="middle">convert Python values</text>
  <text class="meta" x="745" y="247" text-anchor="middle">argument checks / errors</text>

  <rect class="external" x="925" y="145" width="220" height="120" rx="12"/>
  <text class="label" x="1035" y="184" text-anchor="middle">C++ function</text>
  <text class="code" x="1035" y="220" text-anchor="middle">add(2, 3)</text>
  <text class="meta" x="1035" y="247" text-anchor="middle">machine integer add</text>

  <path class="arrow-focus" d="M275 205 H337"/>
  <path class="arrow-focus" d="M565 205 H627"/>
  <path class="arrow-focus" d="M855 205 H917"/>
  <text class="step" x="306" y="188" text-anchor="middle">1</text>
  <text class="step" x="596" y="188" text-anchor="middle">2</text>
  <text class="step" x="886" y="188" text-anchor="middle">3</text>

  <path class="arrow" d="M1035 280 V345 H745"/>
  <path class="arrow" d="M745 345 H455"/>
  <path class="arrow" d="M455 345 H165 V273"/>
  <text class="meta" x="890" y="331" text-anchor="middle">C++ int to Python int</text>
  <text class="meta" x="310" y="331" text-anchor="middle">return PyObject* or set error</text>

  <rect class="panel" x="160" y="395" width="880" height="74" rx="12"/>
  <text class="label" x="600" y="426" text-anchor="middle">The boundary pays for wrapping, checks, conversion, and dispatch</text>
  <text class="meta" x="600" y="455" text-anchor="middle">A tiny native add is usually too little work to amortize those fixed costs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Amortizing the Python C++ boundary cost</title>
  <desc id="desc">Many scalar native calls repeatedly pay the language boundary cost, while one batch call amortizes that fixed cost over more C++ work.</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f8; }
      .panel { fill: #ffffff; stroke: #d4d4d8; stroke-width: 2; }
      .title { fill: #171717; font: 600 28px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .label { fill: #171717; font: 600 20px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .meta { fill: #52525b; font: 16px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .boundary { fill: #f87454; }
      .compute { fill: #0f8a4b; }
      .python { fill: #80c1ff; }
      .axis { stroke: #71717a; stroke-width: 2; }
      .legend { fill: #171717; font: 15px "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="560" rx="16"/>
  <text class="title" x="50" y="52">Why a scalar a + b is often slower through C++</text>

  <rect class="panel" x="50" y="95" width="1100" height="175" rx="14"/>
  <text class="label" x="80" y="132">Plan A: call the C++ add function one million times</text>
  <text class="meta" x="80" y="160">Every add repeats checks, conversion, dispatch, and return-value wrapping</text>
  <line class="axis" x1="90" y1="226" x2="1110" y2="226"/>

  <rect class="python" x="100" y="190" width="70" height="36" rx="6"/>
  <rect class="boundary" x="170" y="180" width="18" height="46" rx="3"/>
  <rect class="compute" x="188" y="196" width="32" height="30" rx="4"/>
  <rect class="boundary" x="220" y="180" width="18" height="46" rx="3"/>
  <rect class="python" x="238" y="190" width="70" height="36" rx="6"/>
  <rect class="boundary" x="308" y="180" width="18" height="46" rx="3"/>
  <rect class="compute" x="326" y="196" width="32" height="30" rx="4"/>
  <rect class="boundary" x="358" y="180" width="18" height="46" rx="3"/>
  <rect class="python" x="376" y="190" width="70" height="36" rx="6"/>
  <rect class="boundary" x="446" y="180" width="18" height="46" rx="3"/>
  <rect class="compute" x="464" y="196" width="32" height="30" rx="4"/>
  <rect class="boundary" x="496" y="180" width="18" height="46" rx="3"/>
  <text class="meta" x="550" y="213">...many tiny calls...</text>
  <rect class="python" x="760" y="190" width="70" height="36" rx="6"/>
  <rect class="boundary" x="830" y="180" width="18" height="46" rx="3"/>
  <rect class="compute" x="848" y="196" width="32" height="30" rx="4"/>
  <rect class="boundary" x="880" y="180" width="18" height="46" rx="3"/>
  <rect class="python" x="898" y="190" width="70" height="36" rx="6"/>
  <rect class="boundary" x="968" y="180" width="18" height="46" rx="3"/>
  <rect class="compute" x="986" y="196" width="32" height="30" rx="4"/>
  <rect class="boundary" x="1018" y="180" width="18" height="46" rx="3"/>

  <rect class="panel" x="50" y="305" width="1100" height="175" rx="14"/>
  <text class="label" x="80" y="342">Plan B: one call performs the entire loop or batch in C++</text>
  <text class="meta" x="80" y="370">Pay the boundary once while native work grows with batch size</text>
  <line class="axis" x1="90" y1="436" x2="1110" y2="436"/>

  <rect class="python" x="100" y="400" width="140" height="36" rx="6"/>
  <rect class="boundary" x="240" y="390" width="24" height="46" rx="3"/>
  <rect class="compute" x="264" y="400" width="670" height="36" rx="6"/>
  <rect class="boundary" x="934" y="390" width="24" height="46" rx="3"/>
  <rect class="python" x="958" y="400" width="140" height="36" rx="6"/>

  <rect class="python" x="255" y="512" width="26" height="20" rx="4"/>
  <text class="legend" x="291" y="528">Python work</text>
  <rect class="boundary" x="465" y="507" width="12" height="30" rx="3"/>
  <text class="legend" x="487" y="528">language boundary</text>
  <rect class="compute" x="690" y="512" width="26" height="20" rx="4"/>
  <text class="legend" x="726" y="528">C++ compute</text>
</svg>

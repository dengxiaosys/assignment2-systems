<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390">
  <rect width="1120" height="390" fill="#ffffff"/>
  <style>
    text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #17212b; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #52606d; }
    .row-label { font-size: 15px; font-weight: 700; }
    .tick { font-size: 11px; fill: #697886; }
    .cell { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .phase { font-size: 13px; font-weight: 700; text-anchor: middle; }
  </style>

  <text x="44" y="35" class="title">GPipe fill-drain schedule (K=3, M=4)</text>
  <text x="44" y="59" class="subtitle">All forward microbatches complete before backward begins; blank slots are pipeline bubbles.</text>

  <text x="92" y="118" class="row-label" text-anchor="end">Stage 0</text>

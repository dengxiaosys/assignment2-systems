  <line x1="590" y1="326" x2="1070" y2="326" stroke="#a95419" stroke-width="3"/>
  <text x="830" y="350" class="phase">Backward drain: M + K - 1 slots</text>
  <text x="590" y="378" class="subtitle" text-anchor="middle">Empty grid cells are idle stage-slots; increasing M amortizes the fixed fill/drain width K-1.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AMP training-step GPU memory lifecycle</title>
  <desc id="desc">Lifetimes of FP32 parameters, low-precision weight copies, saved tensors, gradients, and Adam states.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, "Noto Sans SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", sans-serif; fill: #475569; }
      .phase { font: 700 16px Inter, "Noto Sans SC", sans-serif; fill: #0f172a; }
      .lane { font: 600 16px Inter, "Noto Sans SC", sans-serif; fill: #334155; }
      .bar { font: 600 15px Inter, "Noto Sans SC", sans-serif; fill: #0f172a; }
      .small { font: 400 14px Inter, "Noto Sans SC", sans-serif; fill: #475569; }
      .note { font: 600 14px Inter, "Noto Sans SC", sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="44" y="48" class="title">AMP training step: logical tensor lifetimes in GPU memory</text>
  <text x="44" y="76" class="subtitle">Logical lifetime differs from nvidia-smi: the CUDA allocator may keep freed blocks as reserved memory.</text>

  <rect x="252" y="105" width="1098" height="528" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="252" y="105" width="190" height="54" fill="#f1f5f9"/>
  <rect x="442" y="105" width="250" height="54" fill="#ecfeff"/>
  <rect x="692" y="105" width="198" height="54" fill="#fff7ed"/>
  <rect x="890" y="105" width="240" height="54" fill="#fef2f2"/>
  <rect x="1130" y="105" width="220" height="54" fill="#f1f5f9"/>

  <text x="347" y="138" text-anchor="middle" class="phase">Initialization</text>
  <text x="567" y="129" text-anchor="middle" class="phase">autocast forward</text>
  <text x="567" y="149" text-anchor="middle" class="small">build graph</text>
  <text x="791" y="129" text-anchor="middle" class="phase">context exited</text>
  <text x="791" y="149" text-anchor="middle" class="small">before backward</text>
  <text x="1010" y="129" text-anchor="middle" class="phase">backward</text>
  <text x="1240" y="129" text-anchor="middle" class="phase">step / next iteration</text>

  <line x1="442" y1="105" x2="442" y2="633" stroke="#cbd5e1" stroke-dasharray="6 6"/>
  <line x1="692" y1="105" x2="692" y2="633" stroke="#cbd5e1" stroke-dasharray="6 6"/>
  <line x1="890" y1="105" x2="890" y2="633" stroke="#cbd5e1" stroke-dasharray="6 6"/>
  <line x1="1130" y1="105" x2="1130" y2="633" stroke="#cbd5e1" stroke-dasharray="6 6"/>

  <text x="42" y="211" class="lane">FP32 parameters</text>
  <text x="42" y="286" class="lane">Low-precision weight copies</text>
  <text x="42" y="361" class="lane">Saved activations</text>
  <text x="42" y="436" class="lane">Parameter gradients</text>
  <text x="42" y="511" class="lane">Adam m / v states</text>
  <text x="42" y="586" class="lane">Temporary workspaces</text>

  <line x1="252" y1="235" x2="1350" y2="235" stroke="#e2e8f0"/>
  <line x1="252" y1="310" x2="1350" y2="310" stroke="#e2e8f0"/>
  <line x1="252" y1="385" x2="1350" y2="385" stroke="#e2e8f0"/>
  <line x1="252" y1="460" x2="1350" y2="460" stroke="#e2e8f0"/>
  <line x1="252" y1="535" x2="1350" y2="535" stroke="#e2e8f0"/>

  <rect x="270" y="181" width="1060" height="42" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="800" y="207" text-anchor="middle" class="bar">Persistent: about 4P bytes; autocast never modifies them in place</text>

  <rect x="455" y="256" width="420" height="42" rx="5" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="665" y="282" text-anchor="middle" class="bar">Created per op; cache reuses eligible leaf weights</text>
  <line x1="692" y1="246" x2="692" y2="303" stroke="#0f766e" stroke-width="2"/>
  <text x="707" y="250" class="small">Outermost exit clears the cache map</text>
  <text x="707" y="302" class="small">Graph-held copies may remain alive</text>

  <rect x="455" y="331" width="415" height="42" rx="5" fill="#fef3c7" stroke="#b45309"/>
  <text x="662" y="357" text-anchor="middle" class="bar">Created during forward, retained for backward</text>
  <path d="M870 331 L1110 331 L1010 373 L870 373 Z" fill="#fde68a" stroke="#b45309"/>
  <text x="970" y="357" text-anchor="middle" class="bar">released by node</text>

  <path d="M900 448 L900 406 L1110 406 L1110 448 Z" fill="#fecaca" stroke="#dc2626"/>
  <rect x="1110" y="406" width="220" height="42" rx="5" fill="#fecaca" stroke="#dc2626"/>
  <text x="1005" y="432" text-anchor="middle" class="bar">created and accumulated</text>
  <text x="1220" y="432" text-anchor="middle" class="bar">FP32 grads persist</text>

  <rect x="1145" y="481" width="185" height="42" rx="5" fill="#fed7aa" stroke="#c2410c"/>
  <text x="1237" y="498" text-anchor="middle" class="bar">Lazy init on first step</text>
  <text x="1237" y="517" text-anchor="middle" class="small">FP32, about 8P bytes total</text>

  <rect x="468" y="556" width="128" height="42" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="532" y="582" text-anchor="middle" class="bar">cast / GEMM</text>
  <rect x="924" y="556" width="128" height="42" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="988" y="582" text-anchor="middle" class="bar">backward ops</text>
  <rect x="1160" y="556" width="128" height="42" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="1224" y="582" text-anchor="middle" class="bar">optimizer</text>

  <line x1="692" y1="652" x2="890" y2="652" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="791" y="678" text-anchor="middle" class="note">Exiting autocast restores dispatch state; it does not rewrite existing tensors</text>

  <rect x="42" y="704" width="22" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="718" class="small">persistent FP32</text>
  <rect x="220" y="704" width="22" height="16" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="252" y="718" class="small">low-precision copies</text>
  <rect x="390" y="704" width="22" height="16" fill="#fef3c7" stroke="#b45309"/>
  <text x="422" y="718" class="small">forward-saved data</text>
  <rect x="590" y="704" width="22" height="16" fill="#fecaca" stroke="#dc2626"/>
  <text x="622" y="718" class="small">gradients</text>
  <rect x="710" y="704" width="22" height="16" fill="#fed7aa" stroke="#c2410c"/>
  <text x="742" y="718" class="small">optimizer states</text>
  <rect x="910" y="704" width="22" height="16" fill="#e2e8f0" stroke="#64748b"/>
  <text x="942" y="718" class="small">temporary workspace</text>
</svg>

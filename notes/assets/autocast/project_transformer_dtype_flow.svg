<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Project Transformer dtype flow under CUDA FP16 autocast</title>
  <desc id="desc">FP32 residual stream, FP32 RMSNorm, FP16 matmuls, mixed custom softmax, and FP32 residual output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 28px Inter, "Noto Sans SC", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Inter, "Noto Sans SC", sans-serif; fill: #475569; }
      .lane-title { font: 700 18px Inter, "Noto Sans SC", sans-serif; fill: #0f172a; }
      .box-title { font: 700 16px Inter, "Noto Sans SC", sans-serif; fill: #0f172a; }
      .body { font: 400 14px Inter, "Noto Sans SC", sans-serif; fill: #334155; }
      .chip { font: 700 13px Inter, "Noto Sans SC", sans-serif; }
      .plus { font: 700 30px Inter, "Noto Sans SC", sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1500" height="760" fill="#f8fafc"/>
  <text x="42" y="48" class="title">Project Transformer: typical dtype flow under CUDA FP16 autocast</text>
  <text x="42" y="76" class="subtitle">The residual stream stays FP32; matmuls use FP16; the Python softmax follows per-op policies.</text>

  <rect x="42" y="101" width="22" height="16" fill="#dbeafe" stroke="#2563eb"/>
  <text x="74" y="115" class="body">FP32 storage / output</text>
  <rect x="270" y="101" width="22" height="16" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="302" y="115" class="body">FP16 matmul path</text>
  <rect x="470" y="101" width="22" height="16" fill="#fef3c7" stroke="#b45309"/>
  <text x="502" y="115" class="body">explicit / sensitive FP32</text>
  <rect x="720" y="101" width="22" height="16" fill="#e9d5ff" stroke="#7e22ce"/>
  <text x="752" y="115" class="body">mixed dtype inside one function</text>

  <text x="42" y="164" class="lane-title">Attention branch</text>

  <rect x="42" y="184" width="178" height="66" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="131" y="209" text-anchor="middle" class="box-title">Embedding output</text>
  <text x="131" y="232" text-anchor="middle" class="chip" fill="#1d4ed8">FP32 residual x</text>

  <line x1="220" y1="217" x2="1430" y2="217" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="814" y="202" text-anchor="middle" class="body">FP32 residual stream bypasses the branch</text>

  <line x1="245" y1="217" x2="245" y2="312" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="160" y="320" width="170" height="88" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="245" y="347" text-anchor="middle" class="box-title">RMSNorm</text>
  <text x="245" y="370" text-anchor="middle" class="body">explicit x.float()</text>
  <text x="245" y="392" text-anchor="middle" class="chip" fill="#92400e">output FP32</text>

  <line x1="330" y1="364" x2="365" y2="364" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="365" y="320" width="174" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="452" y="347" text-anchor="middle" class="box-title">Q / K / V matmuls</text>
  <text x="452" y="370" text-anchor="middle" class="body">cast FP32 input and W</text>
  <text x="452" y="392" text-anchor="middle" class="chip" fill="#0f766e">output FP16</text>

  <line x1="539" y1="364" x2="574" y2="364" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="574" y="320" width="154" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="651" y="347" text-anchor="middle" class="box-title">Q @ K^T</text>
  <text x="651" y="370" text-anchor="middle" class="body">batched matmul</text>
  <text x="651" y="392" text-anchor="middle" class="chip" fill="#0f766e">scores FP16</text>

  <line x1="728" y1="364" x2="763" y2="364" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="763" y="295" width="242" height="138" rx="5" fill="#e9d5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="884" y="323" text-anchor="middle" class="box-title">Custom softmax</text>
  <text x="884" y="349" text-anchor="middle" class="body">max / subtract: may stay FP16</text>
  <text x="884" y="372" text-anchor="middle" class="body">exp / sum: promoted to FP32</text>
  <text x="884" y="395" text-anchor="middle" class="body">divide: follows FP32 input</text>
  <text x="884" y="418" text-anchor="middle" class="chip" fill="#7e22ce">probabilities usually FP32</text>

  <line x1="1005" y1="364" x2="1040" y2="364" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1040" y="320" width="154" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1117" y="347" text-anchor="middle" class="box-title">P @ V</text>
  <text x="1117" y="370" text-anchor="middle" class="body">cast P back to FP16</text>
  <text x="1117" y="392" text-anchor="middle" class="chip" fill="#0f766e">output FP16</text>

  <line x1="1194" y1="364" x2="1229" y2="364" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1229" y="320" width="154" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1306" y="347" text-anchor="middle" class="box-title">Output proj</text>
  <text x="1306" y="370" text-anchor="middle" class="body">matmul</text>
  <text x="1306" y="392" text-anchor="middle" class="chip" fill="#0f766e">branch output FP16</text>

  <line x1="1383" y1="364" x2="1430" y2="364" stroke="#475569" stroke-width="3"/>
  <line x1="1430" y1="364" x2="1430" y2="247" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="1430" cy="217" r="27" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="1430" y="227" text-anchor="middle" class="plus">+</text>
  <text x="1430" y="279" text-anchor="middle" class="chip" fill="#1d4ed8">FP32 output</text>
  <text x="1430" y="299" text-anchor="middle" class="body">type promotion</text>

  <text x="42" y="492" class="lane-title">FFN branch</text>
  <rect x="42" y="515" width="178" height="68" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="131" y="542" text-anchor="middle" class="box-title">FP32 residual x</text>
  <text x="131" y="565" text-anchor="middle" class="body">from previous add</text>

  <line x1="220" y1="549" x2="300" y2="549" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="300" y="505" width="180" height="88" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="390" y="533" text-anchor="middle" class="box-title">RMSNorm</text>
  <text x="390" y="557" text-anchor="middle" class="body">internal FP32</text>
  <text x="390" y="579" text-anchor="middle" class="chip" fill="#92400e">output FP32</text>

  <line x1="480" y1="549" x2="550" y2="549" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="550" y="505" width="190" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="645" y="533" text-anchor="middle" class="box-title">W1 / W3 matmul</text>
  <text x="645" y="557" text-anchor="middle" class="body">temporary casts</text>
  <text x="645" y="579" text-anchor="middle" class="chip" fill="#0f766e">output FP16</text>

  <line x1="740" y1="549" x2="810" y2="549" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="810" y="505" width="190" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="905" y="533" text-anchor="middle" class="box-title">SiLU * gate</text>
  <text x="905" y="557" text-anchor="middle" class="body">follows input dtype</text>
  <text x="905" y="579" text-anchor="middle" class="chip" fill="#0f766e">FP16</text>

  <line x1="1000" y1="549" x2="1070" y2="549" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1070" y="505" width="180" height="88" rx="5" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="1160" y="533" text-anchor="middle" class="box-title">W2 matmul</text>
  <text x="1160" y="557" text-anchor="middle" class="body">low-precision compute</text>
  <text x="1160" y="579" text-anchor="middle" class="chip" fill="#0f766e">branch output FP16</text>

  <line x1="1250" y1="549" x2="1320" y2="549" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1320" y="505" width="138" height="88" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="1389" y="533" text-anchor="middle" class="box-title">residual add</text>
  <text x="1389" y="557" text-anchor="middle" class="body">FP32 + FP16</text>
  <text x="1389" y="579" text-anchor="middle" class="chip" fill="#1d4ed8">output FP32</text>

  <rect x="42" y="650" width="1416" height="65" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="62" y="677" class="box-title">Key point</text>
  <text x="165" y="677" class="body">Module names do not set precision. Primitive-op policies, explicit casts, and type promotion do.</text>
  <text x="62" y="701" class="body">This path is specific to the current code and PyTorch 2.11. Re-check it after implementation or backend changes.</text>
</svg>

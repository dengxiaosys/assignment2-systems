<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Alternate ring all-reduce with four ranks</title>
  <desc id="desc">Four rank lanes show the initial accumulator and the three full-tensor messages received in successive rounds.</desc>
  <style>
    .bg { fill: #ffffff; }
    .header { fill: #171717; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 28px; font-weight: 700; }
    .sub { fill: #52525b; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 15px; font-weight: 400; }
    .col-head { fill: #171717; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 17px; font-weight: 650; }
    .rank { fill: #171717; font-family: "DejaVu Sans Mono", monospace; font-size: 18px; font-weight: 700; }
    .cell { fill: #f7f7f8; stroke: #d4d4d8; stroke-width: 1.5; }
    .cell-init { fill: #e9f6ff; stroke: #1683c4; stroke-width: 1.8; }
    .cell-final { fill: #e9faef; stroke: #168a4a; stroke-width: 1.8; }
    .state { fill: #27272a; font-family: "DejaVu Sans Mono", monospace; font-size: 15px; font-weight: 600; }
    .state-final { fill: #0d5c31; font-family: "DejaVu Sans Mono", monospace; font-size: 14px; font-weight: 650; }
    .recv { fill: #a33b20; font-family: "DejaVu Sans Mono", monospace; font-size: 13px; font-weight: 600; }
    .arrow { fill: none; stroke: #71717a; stroke-width: 2; marker-end: url(#arrow); }
    .round-band { fill: #fff8e8; stroke: #d89a19; stroke-width: 1.5; }
    .formula { fill: #171717; font-family: "DejaVu Sans Mono", monospace; font-size: 19px; font-weight: 650; }
    .legend { fill: #3f3f46; font-family: "DejaVu Sans", Arial, sans-serif; font-size: 14px; font-weight: 500; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#71717a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="860"/>
  <text class="header" x="600" y="48" text-anchor="middle">Alternate ring all-reduce · N = 4</text>
  <text class="sub" x="600" y="77" text-anchor="middle">Each round forwards one complete S-byte tensor; every rank accumulates one new contribution.</text>

  <rect class="round-band" x="270" y="104" width="870" height="54" rx="8"/>
  <text class="col-head" x="180" y="137" text-anchor="middle">Initial</text>
  <text class="col-head" x="385" y="137" text-anchor="middle">Round 1</text>
  <text class="col-head" x="655" y="137" text-anchor="middle">Round 2</text>
  <text class="col-head" x="925" y="137" text-anchor="middle">Round 3 · complete</text>

  <!-- Rank 0 -->
  <text class="rank" x="54" y="225">rank 0</text>
  <rect class="cell-init" x="120" y="182" width="160" height="76" rx="8"/>
  <text class="state" x="200" y="214" text-anchor="middle">y = x0</text>
  <text class="sub" x="200" y="239" text-anchor="middle">own tensor</text>
  <path class="arrow" d="M280 220 H320"/>
  <rect class="cell" x="320" y="182" width="200" height="76" rx="8"/>
  <text class="recv" x="420" y="207" text-anchor="middle">receive x3</text>
  <text class="state" x="420" y="234" text-anchor="middle">y = x0 + x3</text>
  <path class="arrow" d="M520 220 H550"/>
  <rect class="cell" x="550" y="182" width="200" height="76" rx="8"/>
  <text class="recv" x="650" y="207" text-anchor="middle">receive x2</text>
  <text class="state" x="650" y="234" text-anchor="middle">y = x0 + x3 + x2</text>
  <path class="arrow" d="M750 220 H780"/>
  <rect class="cell-final" x="780" y="182" width="360" height="76" rx="8"/>
  <text class="recv" x="960" y="207" text-anchor="middle">receive x1</text>
  <text class="state-final" x="960" y="234" text-anchor="middle">y = x0 + x1 + x2 + x3</text>

  <!-- Rank 1 -->
  <text class="rank" x="54" y="351">rank 1</text>
  <rect class="cell-init" x="120" y="308" width="160" height="76" rx="8"/>
  <text class="state" x="200" y="340" text-anchor="middle">y = x1</text>
  <text class="sub" x="200" y="365" text-anchor="middle">own tensor</text>
  <path class="arrow" d="M280 346 H320"/>
  <rect class="cell" x="320" y="308" width="200" height="76" rx="8"/>
  <text class="recv" x="420" y="333" text-anchor="middle">receive x0</text>
  <text class="state" x="420" y="360" text-anchor="middle">y = x1 + x0</text>
  <path class="arrow" d="M520 346 H550"/>
  <rect class="cell" x="550" y="308" width="200" height="76" rx="8"/>
  <text class="recv" x="650" y="333" text-anchor="middle">receive x3</text>
  <text class="state" x="650" y="360" text-anchor="middle">y = x1 + x0 + x3</text>
  <path class="arrow" d="M750 346 H780"/>
  <rect class="cell-final" x="780" y="308" width="360" height="76" rx="8"/>
  <text class="recv" x="960" y="333" text-anchor="middle">receive x2</text>
  <text class="state-final" x="960" y="360" text-anchor="middle">y = x0 + x1 + x2 + x3</text>

  <!-- Rank 2 -->
  <text class="rank" x="54" y="477">rank 2</text>
  <rect class="cell-init" x="120" y="434" width="160" height="76" rx="8"/>
  <text class="state" x="200" y="466" text-anchor="middle">y = x2</text>
  <text class="sub" x="200" y="491" text-anchor="middle">own tensor</text>
  <path class="arrow" d="M280 472 H320"/>
  <rect class="cell" x="320" y="434" width="200" height="76" rx="8"/>
  <text class="recv" x="420" y="459" text-anchor="middle">receive x1</text>
  <text class="state" x="420" y="486" text-anchor="middle">y = x2 + x1</text>
  <path class="arrow" d="M520 472 H550"/>
  <rect class="cell" x="550" y="434" width="200" height="76" rx="8"/>
  <text class="recv" x="650" y="459" text-anchor="middle">receive x0</text>
  <text class="state" x="650" y="486" text-anchor="middle">y = x2 + x1 + x0</text>
  <path class="arrow" d="M750 472 H780"/>
  <rect class="cell-final" x="780" y="434" width="360" height="76" rx="8"/>
  <text class="recv" x="960" y="459" text-anchor="middle">receive x3</text>
  <text class="state-final" x="960" y="486" text-anchor="middle">y = x0 + x1 + x2 + x3</text>

  <!-- Rank 3 -->
  <text class="rank" x="54" y="603">rank 3</text>
  <rect class="cell-init" x="120" y="560" width="160" height="76" rx="8"/>
  <text class="state" x="200" y="592" text-anchor="middle">y = x3</text>
  <text class="sub" x="200" y="617" text-anchor="middle">own tensor</text>
  <path class="arrow" d="M280 598 H320"/>
  <rect class="cell" x="320" y="560" width="200" height="76" rx="8"/>
  <text class="recv" x="420" y="585" text-anchor="middle">receive x2</text>
  <text class="state" x="420" y="612" text-anchor="middle">y = x3 + x2</text>
  <path class="arrow" d="M520 598 H550"/>
  <rect class="cell" x="550" y="560" width="200" height="76" rx="8"/>
  <text class="recv" x="650" y="585" text-anchor="middle">receive x1</text>
  <text class="state" x="650" y="612" text-anchor="middle">y = x3 + x2 + x1</text>
  <path class="arrow" d="M750 598 H780"/>
  <rect class="cell-final" x="780" y="560" width="360" height="76" rx="8"/>
  <text class="recv" x="960" y="585" text-anchor="middle">receive x0</text>
  <text class="state-final" x="960" y="612" text-anchor="middle">y = x0 + x1 + x2 + x3</text>

  <rect class="round-band" x="120" y="690" width="1020" height="116" rx="8"/>
  <text class="formula" x="630" y="730" text-anchor="middle">3 serial rounds × S bytes per rank = 3S bytes per rank</text>
  <text class="formula" x="630" y="768" text-anchor="middle">T = (N - 1)S/W = 3S/W</text>
  <text class="legend" x="630" y="794" text-anchor="middle">Parallel inside each round; dependent across rounds.</text>
</svg>

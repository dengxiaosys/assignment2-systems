<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .section { font: 700 20px Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Arial, sans-serif; fill: #172033; }
      .small { font: 14px Arial, sans-serif; fill: #475569; }
      .mono { font: 15px "DejaVu Sans Mono", monospace; fill: #172033; }
      .metric { font: 700 19px Arial, sans-serif; fill: #172033; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="48" y="50" class="title">One-level checkpoint grouping: where peak memory comes from</text>
  <text x="48" y="78" class="subtitle">Example: N = 12 blocks, k = 3 blocks per checkpoint, four non-nested segments.</text>

  <rect x="40" y="108" width="1320" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="68" y="145" class="section">Forward end: keep only segment inputs</text>

  <g>
    <rect x="80" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="182" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="284" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="386" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="488" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="590" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="692" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="794" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="896" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="998" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="1100" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <rect x="1202" y="190" width="82" height="58" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="108" y="226" class="label">1</text>
    <text x="210" y="226" class="label">2</text>
    <text x="312" y="226" class="label">3</text>
    <text x="414" y="226" class="label">4</text>
    <text x="516" y="226" class="label">5</text>
    <text x="618" y="226" class="label">6</text>
    <text x="720" y="226" class="label">7</text>
    <text x="822" y="226" class="label">8</text>
    <text x="924" y="226" class="label">9</text>
    <text x="1021" y="226" class="label">10</text>
    <text x="1123" y="226" class="label">11</text>
    <text x="1225" y="226" class="label">12</text>
  </g>

  <g stroke="#16a34a" stroke-width="5">
    <line x1="70" y1="174" x2="70" y2="266"/>
    <line x1="376" y1="174" x2="376" y2="266"/>
    <line x1="682" y1="174" x2="682" y2="266"/>
    <line x1="988" y1="174" x2="988" y2="266"/>
  </g>
  <g fill="#16a34a">
    <circle cx="70" cy="174" r="8"/>
    <circle cx="376" cy="174" r="8"/>
    <circle cx="682" cy="174" r="8"/>
    <circle cx="988" cy="174" r="8"/>
  </g>
  <text x="80" y="286" class="small">green markers: 4 checkpoint inputs, long-lived storage = (N / k) C</text>

  <rect x="40" y="344" width="1320" height="210" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="68" y="381" class="section">Backward peak: boundaries still live while one segment is recomputed</text>

  <rect x="88" y="423" width="110" height="62" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="218" y="423" width="110" height="62" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="348" y="423" width="110" height="62" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <rect x="478" y="423" width="110" height="62" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="126" y="451" class="label">C1</text>
  <text x="256" y="451" class="label">C2</text>
  <text x="386" y="451" class="label">C3</text>
  <text x="516" y="451" class="label">C4</text>
  <text x="111" y="474" class="small">input</text>
  <text x="241" y="474" class="small">input</text>
  <text x="371" y="474" class="small">input</text>
  <text x="501" y="474" class="small">input</text>

  <text x="628" y="462" class="metric">+</text>

  <rect x="698" y="405" width="178" height="98" rx="7" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
  <rect x="896" y="405" width="178" height="98" rx="7" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
  <rect x="1094" y="405" width="178" height="98" rx="7" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
  <text x="752" y="445" class="label">block 7</text>
  <text x="950" y="445" class="label">block 8</text>
  <text x="1144" y="445" class="label">block 9</text>
  <text x="738" y="475" class="small">temporary R</text>
  <text x="936" y="475" class="small">temporary R</text>
  <text x="1134" y="475" class="small">temporary R</text>
  <text x="88" y="523" class="mono">4 C = (N / k) C</text>
  <text x="698" y="529" class="mono">3 R = k R</text>

  <rect x="40" y="586" width="760" height="126" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="68" y="624" class="metric">Peak model</text>
  <text x="68" y="658" class="mono">M(k) ~= (N / k) C + k R</text>
  <text x="68" y="691" class="mono">k* = sqrt(N C / R)</text>

  <rect x="840" y="586" width="520" height="126" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="868" y="624" class="metric">Trade-off</text>
  <text x="868" y="655" class="small">smaller k: more green checkpoint inputs, fewer orange residuals</text>
  <text x="868" y="684" class="small">larger k: fewer green checkpoint inputs, more orange residuals</text>
</svg>

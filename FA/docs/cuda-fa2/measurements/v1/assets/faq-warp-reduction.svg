<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">warp 求和：线程私有部分和通过 shuffle 汇到 lane 0</title>
  <desc id="desc">用四个 lane 缩小演示归约，初始值分别是 a、b、c、d。stride 为 2 后，lane 0 和 lane 1 分别得到 a 加 c 与 b 加 d；stride 为 1 后，lane 0 得到四个值的总和。图仅保留总和依赖路径，其他 lane 仍执行两轮指令。真实代码有三十二个 lane，stride 依次为十六、八、四、二、一。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#f8fafc"/>
  <g font-family="sans-serif" fill="#0f172a">
    <text x="40" y="38" font-size="20" font-weight="700">warp_sum：每个线程有自己的 value，shuffle 复制其他 lane 的值</text>
    <text x="40" y="67" font-size="14" fill="#475569">4 个 lane 按归约分组摆放；只画 lane 0 总和的依赖路径，不表示实际线程位置或耗时。</text>
    <text x="40" y="131" font-size="15">进入函数</text>
    <g fill="#eff6ff" stroke="#93c5fd">
      <rect x="185" y="95" width="150" height="66" rx="8"/>
      <rect x="365" y="95" width="150" height="66" rx="8"/>
      <rect x="585" y="95" width="150" height="66" rx="8"/>
      <rect x="765" y="95" width="150" height="66" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="14">
      <text x="260" y="120">lane 0</text><text x="260" y="145" font-family="monospace">a</text>
      <text x="440" y="120">lane 2</text><text x="440" y="145" font-family="monospace">c</text>
      <text x="660" y="120">lane 1</text><text x="660" y="145" font-family="monospace">b</text>
      <text x="840" y="120">lane 3</text><text x="840" y="145" font-family="monospace">d</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M260 161 L302 237"/>
      <path d="M440 161 L398 237"/>
      <path d="M660 161 L702 237"/>
      <path d="M840 161 L798 237"/>
    </g>
    <text x="40" y="271" font-size="15">stride = 2</text>
    <g fill="#eff6ff" stroke="#93c5fd">
      <rect x="185" y="239" width="330" height="66" rx="8"/>
      <rect x="585" y="239" width="330" height="66" rx="8"/>
    </g>
    <g text-anchor="middle" font-size="14">
      <text x="350" y="264">lane 0</text><text x="350" y="289" font-family="monospace">a + c</text>
      <text x="750" y="264">lane 1</text><text x="750" y="289" font-family="monospace">b + d</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M350 305 L350 381"/>
      <path d="M750 305 L448 381"/>
    </g>
    <text x="40" y="416" font-size="15">stride = 1</text>
    <rect x="185" y="383" width="330" height="66" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <g text-anchor="middle" font-size="14">
      <text x="350" y="408" font-weight="700">lane 0：完整点积</text>
      <text x="350" y="433" font-family="monospace">(a + c) + (b + d)</text>
    </g>
    <text x="585" y="405" font-size="14">__device__：仍由当前 GPU 线程执行</text>
    <text x="585" y="432" font-size="14">__shfl_down_sync：warp 内交换值</text>
    <text x="40" y="496" font-size="15" font-weight="700">真实 32-lane 归约：stride = 16 → 8 → 4 → 2 → 1，共 5 轮。</text>
    <text x="40" y="524" font-size="14" fill="#475569">所有参与 lane 都执行；只有 lane 0 的返回值被本 kernel 当作完整总和使用。</text>
  </g>
</svg>

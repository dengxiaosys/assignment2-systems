<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">V2 shared tile 与 query warp 计算协议</title>
  <desc id="desc">256 个线程协作加载 32 行 K/V，第一屏障发布数据。8 个 query warp 各自执行 QK、tile softmax、PV。第二屏障等待全部读者，随后覆盖 shared。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
  </defs>
  <rect width="1000" height="580" rx="16" fill="#f8fafc"/>
  <g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" fill="#0f172a">
    <text x="35" y="42" font-size="23" font-weight="700">V2：Bq = 8 行 / CTA × Bk = 32 key / tile</text>
    <text x="35" y="70" font-size="15" fill="#475569">每个 warp 独占一个 query；两次 CTA 屏障只保护 K/V tile 的发布与复用</text>
    <rect x="35" y="96" width="220" height="108" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="53" y="123" font-size="18" font-weight="700">协作加载 · 256 threads</text>
    <text x="53" y="150" font-size="15">global 按 [key][dim] 连续读</text>
    <text x="53" y="174" font-size="15">K → shared 转置 + padding</text>
    <text x="53" y="194" font-size="15">V → shared 保持 [key][dim]</text>
    <path d="M260 150H295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="303" y="106" width="125" height="89" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="319" y="139" font-size="17" font-weight="700">屏障 1</text>
    <text x="319" y="168" font-size="15">发布 K/V</text>
    <path d="M433 150H469" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="477" y="96" width="487" height="108" rx="10" fill="#dcfce7" stroke="#86efac"/>
    <text x="495" y="123" font-size="18" font-weight="700">8 个 query warp 独立计算</text>
    <text x="495" y="150" font-size="15">CTA a=0：warp 0 → q₁　…　warp 7 → q₈</text>
    <text x="495" y="176" font-size="15">每行 qᵢ/zᵢ 私有寄存器；shared K/V 由 Bq 行复用</text>
    <text x="35" y="246" font-size="19" font-weight="700">单个 query warp 内：lane 的角色随阶段切换</text>
    <rect x="35" y="263" width="278" height="139" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
    <text x="53" y="290" font-size="17" font-weight="700">① QK：lane 拥有 key</text>
    <text x="53" y="319" font-size="15">ki = tilei + lanei</text>
    <text x="53" y="344" font-size="15">Q 分量逐个 shuffle 广播</text>
    <text x="53" y="369" font-size="15">读 k_tile[dimi][lanei]，沿 d 累加</text>
    <text x="53" y="391" font-size="15">32 个 score 同时计算</text>
    <path d="M319 330H350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="358" y="263" width="278" height="139" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="376" y="290" font-size="17" font-weight="700">② Tile softmax</text>
    <text x="376" y="319" font-size="15">max all-reduce → m_new</text>
    <text x="376" y="344" font-size="15">expf(s - m_new) → p_tilde</text>
    <text x="376" y="369" font-size="15">warp_sum(p_tilde) → l_tile</text>
    <text x="376" y="391" font-size="15">更新 m/ℓ/z；旧 ℓ/z 缩放一次</text>
    <path d="M642 330H674" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="682" y="263" width="282" height="139" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="700" y="290" font-size="17" font-weight="700">③ PV：lane 拥有维度</text>
    <text x="700" y="319" font-size="15">dimi = ri * WARP_SIZE + lanei</text>
    <text x="700" y="344" font-size="15">p_tilde 逐 key shuffle 广播</text>
    <text x="700" y="369" font-size="15">读 v_tile[keyi][dimi]，更新 z[ri]</text>
    <text x="700" y="391" font-size="15">无需跨 warp 输出归约</text>
    <path d="M823 407V438H435" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="303" y="418" width="125" height="77" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="319" y="447" font-size="17" font-weight="700">屏障 2</text>
    <text x="319" y="476" font-size="15">读者完成</text>
    <path d="M297 456H145V211" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="35" y="534" font-size="16" fill="#475569">下一 tile 覆盖 shared；query 尾部 warp 不计算输出，但仍加载并参加两次屏障。</text>
    <text x="35" y="558" font-size="16" fill="#475569">跨 tile 状态仍串行：16384 个 key → 512 次状态更新（N=16384，non-causal；benchmark S=N）。</text>
  </g>
</svg>

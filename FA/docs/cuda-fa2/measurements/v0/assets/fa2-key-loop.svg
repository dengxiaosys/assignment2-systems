<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="748" viewBox="0 0 1100 748" role="img" aria-labelledby="title description">
  <title id="title">Custom attention 每个 key 的计算与同步链</title>
  <desc id="description">固定一个 query 的 CTA 加载 K 并写入 shared，执行一次屏障，做七级树形归约且每级执行一次屏障，thread 0 更新 softmax 状态后执行一次屏障，再加载 V 并更新输出累积后执行一次屏障，随后进入下一个 key。每个 key 共十次 CTA 屏障，状态在相邻 key 间递推。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .title { font-size: 29px; font-weight: 700; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; fill: #40536d; }
      .label { font-size: 17px; fill: #52647a; }
      .badge { font-size: 17px; fill: #94651d; font-weight: 700; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="748" fill="#ffffff"/>
  <text x="48" y="48" class="title">Custom kernel：固定一个 query，逐个 key 递推</text>
  <text x="48" y="81" class="body">128 threads / CTA · d = 64 · 每轮只有一个标量 score</text>

  <rect x="48" y="125" width="614" height="89" rx="14" fill="#eff6ff" stroke="#93b7df" stroke-width="1.5"/>
  <text x="72" y="161" class="heading">1. 加载 K、乘 Q，写入 shared reduction</text>
  <text x="72" y="194" class="body">64 个线程计算有效维度，其余写入零</text>
  <path d="M355 214V271" class="connector"/>
  <rect x="433" y="228" width="154" height="28" rx="8" fill="#fff3d6"/>
  <text x="448" y="248" class="badge">CTA barrier × 1</text>

  <rect x="48" y="271" width="614" height="98" rx="14" fill="#eef2ff" stroke="#a4b1df" stroke-width="1.5"/>
  <text x="72" y="307" class="heading">2. 七级 shared tree reduction</text>
  <text x="72" y="341" class="body">加法 lane 数：64 → 32 → 16 → 8 → 4 → 2 → 1</text>
  <rect x="704" y="291" width="328" height="58" rx="12" fill="#fff8eb" stroke="#dec08d" stroke-width="1.5"/>
  <text x="724" y="327" class="badge">每级 CTA barrier × 1，共 7 次</text>
  <path d="M662 320H704" stroke="#b7791f" stroke-width="2" fill="none"/>
  <path d="M355 369V420" class="connector"/>

  <rect x="48" y="420" width="614" height="90" rx="14" fill="#ecfdf5" stroke="#89c8b5" stroke-width="1.5"/>
  <text x="72" y="456" class="heading">3. Thread 0 更新 online softmax</text>
  <text x="72" y="489" class="body">计算 m/l 与 alpha/p_tilde，向其他线程广播权重</text>
  <path d="M355 510V568" class="connector"/>
  <rect x="433" y="525" width="154" height="28" rx="8" fill="#fff3d6"/>
  <text x="448" y="545" class="badge">CTA barrier × 1</text>

  <rect x="48" y="568" width="614" height="89" rx="14" fill="#eff6ff" stroke="#93b7df" stroke-width="1.5"/>
  <text x="72" y="604" class="heading">4. 加载 V，更新各线程自己的输出累积 z</text>
  <text x="72" y="637" class="body">z ← alpha × z + p_tilde × V；线程间分量独立</text>
  <path d="M355 657V698H1064V108H355V125" class="connector" stroke-dasharray="6 5"/>
  <rect x="48" y="682" width="295" height="31" rx="8" fill="#fff3d6"/>
  <text x="62" y="703" class="badge">CTA barrier × 1 → 下一个 key</text>

  <rect x="704" y="408" width="328" height="151" rx="14" fill="#f8fafc" stroke="#d6deea" stroke-width="1.5"/>
  <text x="724" y="444" class="heading">每个 key 的屏障数量</text>
  <text x="724" y="478" class="body">1 + 7 + 1 + 1 = 10 次</text>
  <text x="724" y="514" class="body">下一个 key 依赖本轮的 m/l/z 状态</text>
  <text x="724" y="540" class="label">同步链与递推链共同限制就绪工作</text>

  <rect x="704" y="578" width="328" height="79" rx="12" fill="#fff8eb" stroke="#dec08d" stroke-width="1.5"/>
  <text x="724" y="608" class="body">循环结束后才计算 O = z / l</text>
  <text x="724" y="636" class="label">图中不包含循环外的最后一次屏障</text>
</svg>

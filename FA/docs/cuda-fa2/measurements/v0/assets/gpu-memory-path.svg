<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title description">
  <title id="title">Global load、缓存、DRAM、寄存器与 shared memory 的关系</title>
  <desc id="description">线程发出 global load，请求可能由近端缓存满足，也可能到达 L2。L2 命中时返回数据，未命中时从 DRAM 获取。数据进入线程寄存器。程序可显式在寄存器和 CTA shared memory 之间读写；shared memory 不是 global load 自动经过的缓存。</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="return-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#17836b"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .title { font-size: 29px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; fill: #40536d; }
      .label { font-size: 17px; fill: #52647a; }
      .return-label { font-size: 17px; fill: #17836b; }
      .request { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#request-arrow); }
      .returned { fill: none; stroke: #17836b; stroke-width: 2.5; marker-end: url(#return-arrow); }
    </style>
  </defs>
  <rect width="1100" height="690" fill="#ffffff"/>
  <text x="48" y="48" class="title">Global load：请求可能由缓存满足，也可能到达 DRAM</text>
  <text x="48" y="81" class="body">示意访问路径；具体缓存策略取决于编译后的指令与 GPU 架构。</text>

  <rect x="48" y="125" width="400" height="72" rx="14" fill="#eff6ff" stroke="#93b7df" stroke-width="1.5"/>
  <text x="72" y="169" class="heading">线程发出 global load</text>
  <path d="M248 197V233" class="request"/>

  <rect x="48" y="233" width="400" height="94" rx="14" fill="#f8fafc" stroke="#c5d1df" stroke-width="1.5"/>
  <text x="72" y="269" class="heading">加载与近端缓存路径</text>
  <text x="72" y="303" class="body">是否缓存、使用哪条路径，取决于指令</text>

  <path d="M248 327V391" class="request"/>
  <text x="267" y="365" class="label">请求继续到 L2</text>
  <rect x="48" y="391" width="400" height="100" rx="14" fill="#eef2ff" stroke="#a4b1df" stroke-width="1.5"/>
  <text x="72" y="427" class="heading">L2 cache</text>
  <text x="72" y="460" class="body">多个 SM 共享；统计 L2 请求与命中</text>

  <path d="M248 491V557" class="request"/>
  <text x="267" y="532" class="label">未命中，需要取数</text>
  <rect x="48" y="557" width="400" height="88" rx="14" fill="#fff8eb" stroke="#dec08d" stroke-width="1.5"/>
  <text x="72" y="592" class="heading">DRAM：设备显存</text>
  <text x="72" y="623" class="body">GTX 1060 使用 GDDR5，保存 Q/K/V/O</text>

  <rect x="680" y="210" width="360" height="117" rx="14" fill="#ecfdf5" stroke="#89c8b5" stroke-width="1.5"/>
  <text x="704" y="247" class="heading">数据进入线程寄存器</text>
  <text x="704" y="279" class="body">保存线程自己的计算状态</text>
  <text x="704" y="307" class="body">例如 q_dim、输出累积 z</text>

  <path d="M448 260H680" class="returned"/>
  <text x="483" y="244" class="return-label">近端缓存满足</text>
  <path d="M448 431H570V291H680" class="returned"/>
  <text x="475" y="416" class="return-label">L2 命中，返回数据</text>
  <path d="M448 601H624V313H680" class="returned" stroke-dasharray="6 5"/>
  <text x="475" y="584" class="return-label">DRAM 取数后返回</text>

  <rect x="680" y="426" width="360" height="100" rx="14" fill="#eff6ff" stroke="#93b7df" stroke-width="1.5"/>
  <text x="704" y="463" class="heading">Shared memory</text>
  <text x="704" y="496" class="body">CTA 内共享，程序显式管理的片上存储</text>
  <path d="M783 327V426" class="request"/>
  <text x="696" y="382" class="label">显式写入</text>
  <path d="M923 426V327" class="returned"/>
  <text x="941" y="382" class="return-label">显式读取</text>

  <rect x="680" y="568" width="360" height="77" rx="12" fill="#f8fafc" stroke="#d6deea" stroke-width="1.5"/>
  <text x="701" y="599" class="body">Shared memory 需要程序读写与同步，</text>
  <text x="701" y="627" class="body">不是 global load 自动经过的一层缓存。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title description">
  <title id="title">Warp 从驻留到指令执行的过程</title>
  <desc id="description">驻留 warp 检查下一条指令是否就绪。等待数据或同步的 warp 仍占用资源，条件解除后可成为 eligible warp。就绪 warp 由调度器选择并发射指令，未选中者等待后续调度。线程掩码和谓词决定实际执行的 lane。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
    <marker id="wait-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b7791f"/>
    </marker>
    <style>
      text { font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172b4d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #52647a; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; fill: #40536d; }
      .metric { font-size: 17px; fill: #2463a6; }
      .label { font-size: 17px; fill: #64748b; }
      .wait-label { font-size: 17px; fill: #94651d; }
      .connector { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .wait-connector { fill: none; stroke: #b7791f; stroke-width: 2.5; marker-end: url(#wait-arrow); }
    </style>
  </defs>
  <rect width="1100" height="780" fill="#ffffff"/>
  <text x="48" y="48" class="title">Warp：驻留 → 就绪 → 发射 → Lane 执行</text>
  <text x="48" y="82" class="subtitle">四个环节对应不同指标；占用资源不代表此刻可以执行。</text>

  <rect x="48" y="124" width="520" height="96" rx="14" fill="#eff6ff" stroke="#93b7df" stroke-width="1.5"/>
  <text x="72" y="158" class="heading">1. 驻留 warp</text>
  <text x="72" y="187" class="body">已经分配 SM 资源，尚未完成</text>
  <text x="72" y="210" class="metric">观察：achieved_occupancy / sm_efficiency</text>

  <path d="M308 220V304" class="connector"/>
  <text x="330" y="269" class="label">下一条指令已就绪</text>

  <rect x="48" y="304" width="520" height="96" rx="14" fill="#ecfdf5" stroke="#89c8b5" stroke-width="1.5"/>
  <text x="72" y="338" class="heading">2. Eligible warp</text>
  <text x="72" y="367" class="body">具备发射条件，可以参与调度</text>
  <text x="72" y="390" class="metric">观察：eligible_warps_per_cycle</text>

  <path d="M308 400V484" class="connector"/>
  <text x="330" y="449" class="label">调度器选中，发射机会可用</text>

  <rect x="48" y="484" width="520" height="96" rx="14" fill="#eef2ff" stroke="#a4b1df" stroke-width="1.5"/>
  <text x="72" y="518" class="heading">3. 发射指令</text>
  <text x="72" y="547" class="body">使用 issue slot，交给相应功能单元</text>
  <text x="72" y="570" class="metric">观察：issue_slot_utilization</text>

  <path d="M308 580V650" class="connector"/>
  <text x="330" y="622" class="label">线程掩码与谓词决定执行者</text>

  <rect x="48" y="650" width="520" height="94" rx="14" fill="#eff6ff" stroke="#93b7df" stroke-width="1.5"/>
  <text x="72" y="683" class="heading">4. 部分或全部 lane 执行</text>
  <text x="72" y="711" class="metric">观察：warp_execution_efficiency</text>
  <text x="72" y="735" class="metric">以及 warp_nonpred_execution_efficiency</text>

  <rect x="660" y="146" width="390" height="126" rx="14" fill="#fff8eb" stroke="#dec08d" stroke-width="1.5"/>
  <text x="682" y="181" class="heading">等待数据或 CTA 同步</text>
  <text x="682" y="212" class="body">仍然驻留，但暂时不可发射</text>
  <text x="682" y="243" class="wait-label">观察：stall_exec_dependency、stall_sync 等</text>
  <path d="M568 170H660" class="wait-connector"/>
  <text x="581" y="157" class="wait-label">未就绪</text>
  <path d="M855 272V330H568" class="wait-connector" stroke-dasharray="6 5"/>
  <text x="590" y="300" class="wait-label">条件解除后进入就绪状态</text>

  <rect x="660" y="390" width="390" height="126" rx="14" fill="#fff8eb" stroke="#dec08d" stroke-width="1.5"/>
  <text x="682" y="425" class="heading">本次没有被选中</text>
  <text x="682" y="456" class="body">仍可参与后续调度</text>
  <text x="682" y="487" class="wait-label">观察：stall_not_selected</text>
  <path d="M568 366H620V436H660" class="wait-connector"/>
  <text x="683" y="375" class="wait-label">调度器选择了其他 warp</text>

  <rect x="660" y="584" width="390" height="160" rx="14" fill="#f8fafc" stroke="#d6deea" stroke-width="1.5"/>
  <text x="682" y="619" class="heading">阅读指标时逐层检查</text>
  <text x="682" y="651" class="body">驻留数量 → 就绪候选 → 发射机会</text>
  <text x="682" y="681" class="body">→ Lane 参与 → 实际有效工作</text>
  <text x="682" y="716" class="subtitle">任何单个比例都不等于整体算力利用率。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">寄存器微矩阵外积：一次加载的操作数服务多次 FFMA</text>
  <text x="450" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">以 4×4 为例（v3）：加载 4 个 a + 4 个 b（8 操作数）→ 16 次乘加</text>

  <!-- a vector (left column) -->
  <text x="88" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">a (Q 片段)</text>
  <rect x="60" y="124" width="56" height="48" rx="4" fill="#3b82f6"/><text x="88" y="153" text-anchor="middle" font-size="13" fill="#fff">a₀</text>
  <rect x="60" y="176" width="56" height="48" rx="4" fill="#3b82f6"/><text x="88" y="205" text-anchor="middle" font-size="13" fill="#fff">a₁</text>
  <rect x="60" y="228" width="56" height="48" rx="4" fill="#3b82f6"/><text x="88" y="257" text-anchor="middle" font-size="13" fill="#fff">a₂</text>
  <rect x="60" y="280" width="56" height="48" rx="4" fill="#3b82f6"/><text x="88" y="309" text-anchor="middle" font-size="13" fill="#fff">a₃</text>

  <!-- b vector (top row) -->
  <text x="300" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">b (K 片段)</text>
  <rect x="160" y="68" width="60" height="40" rx="4" fill="#10b981"/><text x="190" y="93" text-anchor="middle" font-size="13" fill="#fff">b₀</text>
  <rect x="226" y="68" width="60" height="40" rx="4" fill="#10b981"/><text x="256" y="93" text-anchor="middle" font-size="13" fill="#fff">b₁</text>
  <rect x="292" y="68" width="60" height="40" rx="4" fill="#10b981"/><text x="322" y="93" text-anchor="middle" font-size="13" fill="#fff">b₂</text>
  <rect x="358" y="68" width="60" height="40" rx="4" fill="#10b981"/><text x="388" y="93" text-anchor="middle" font-size="13" fill="#fff">b₃</text>

  <!-- accumulator grid 4x4 -->
  <g>
    <!-- cells -->
    <!-- row generation via explicit rects -->
    <!-- r0 -->
    <rect x="160" y="124" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="190" y="153" text-anchor="middle" font-size="11" fill="#991b1b">a₀b₀</text>
    <rect x="226" y="124" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="256" y="153" text-anchor="middle" font-size="11" fill="#991b1b">a₀b₁</text>
    <rect x="292" y="124" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="322" y="153" text-anchor="middle" font-size="11" fill="#991b1b">a₀b₂</text>
    <rect x="358" y="124" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="388" y="153" text-anchor="middle" font-size="11" fill="#991b1b">a₀b₃</text>
    <!-- r1 -->
    <rect x="160" y="176" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="190" y="205" text-anchor="middle" font-size="11" fill="#991b1b">a₁b₀</text>
    <rect x="226" y="176" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="256" y="205" text-anchor="middle" font-size="11" fill="#991b1b">a₁b₁</text>
    <rect x="292" y="176" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="322" y="205" text-anchor="middle" font-size="11" fill="#991b1b">a₁b₂</text>
    <rect x="358" y="176" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="388" y="205" text-anchor="middle" font-size="11" fill="#991b1b">a₁b₃</text>
    <!-- r2 -->
    <rect x="160" y="228" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="190" y="257" text-anchor="middle" font-size="11" fill="#991b1b">a₂b₀</text>
    <rect x="226" y="228" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="256" y="257" text-anchor="middle" font-size="11" fill="#991b1b">a₂b₁</text>
    <rect x="292" y="228" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="322" y="257" text-anchor="middle" font-size="11" fill="#991b1b">a₂b₂</text>
    <rect x="358" y="228" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="388" y="257" text-anchor="middle" font-size="11" fill="#991b1b">a₂b₃</text>
    <!-- r3 -->
    <rect x="160" y="280" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="190" y="309" text-anchor="middle" font-size="11" fill="#991b1b">a₃b₀</text>
    <rect x="226" y="280" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="256" y="309" text-anchor="middle" font-size="11" fill="#991b1b">a₃b₁</text>
    <rect x="292" y="280" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="322" y="309" text-anchor="middle" font-size="11" fill="#991b1b">a₃b₂</text>
    <rect x="358" y="280" width="60" height="48" rx="3" fill="#fee2e2" stroke="#f87171"/><text x="388" y="309" text-anchor="middle" font-size="11" fill="#991b1b">a₃b₃</text>
  </g>
  <text x="290" y="352" text-anchor="middle" font-size="12" fill="#334155">16 个寄存器 accumulator：score[q][k] += a[q]·b[k]</text>

  <!-- operand reuse ratio panel -->
  <rect x="470" y="124" width="400" height="204" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="670" y="148" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">operand / FFMA 比随微矩阵增大而下降</text>
  <text x="490" y="178" font-size="12.5" fill="#334155">v2  标量链：每次 shared 读只服务 1 次乘加</text>
  <text x="490" y="206" font-size="12.5" fill="#ca8a04">v3  4×4：8 操作数 / 16 FFMA = 0.5</text>
  <text x="490" y="234" font-size="12.5" fill="#16a34a">v4  8×4：12 操作数 / 32 FFMA = 0.375</text>
  <text x="490" y="262" font-size="12.5" fill="#2563eb">v5  8×8：16 操作数 / 64 FFMA = 0.25</text>
  <rect x="490" y="278" width="360" height="38" rx="6" fill="#eff6ff"/>
  <text x="670" y="302" text-anchor="middle" font-size="11.5" fill="#1e40af">比值越低 → 摊薄 shared 读取与地址计算，打断长依赖链</text>

  <rect x="470" y="344" width="400" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="670" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">但代价是寄存器压力</text>
  <text x="490" y="392" font-size="11.5" fill="#78350f">v5 两组 8×8 = 128 个 accumulator → ~224 寄存器</text>
  <text x="490" y="410" font-size="11.5" fill="#78350f">occupancy 降至 12.5%，仍因指令/同步更少而更快</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760" role="img" aria-labelledby="title desc">
  <title id="title">Attention backward dependency DAG</title>
  <desc id="desc">Shared dependency graph for computing dQ, dK, and dV from saved tensors P, Q, K, V and upstream gradient dO.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475467"/>
    </marker>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #101828; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475467; }
      .label { font: 700 17px Arial, sans-serif; fill: #101828; text-anchor: middle; }
      .shape { font: 400 14px Arial, sans-serif; fill: #475467; text-anchor: middle; }
      .edge { fill: none; stroke: #475467; stroke-width: 2; marker-end: url(#arrow); }
      .source { fill: #eaf2ff; stroke: #2563eb; stroke-width: 2; }
      .large { fill: #fff0ed; stroke: #d92d20; stroke-width: 2; }
      .output { fill: #ecfdf3; stroke: #039855; stroke-width: 2; }
      .legend { font: 400 14px Arial, sans-serif; fill: #344054; }
    </style>
  </defs>

  <rect width="1080" height="760" fill="#ffffff"/>
  <text x="40" y="42" class="title">Attention backward: shared data dependencies</text>
  <text x="40" y="68" class="subtitle">Each tensor is shown once. An incoming arrow means the target computation reads that tensor.</text>

  <!-- Edges are drawn before nodes so arrow lines remain behind boxes. -->
  <path class="edge" d="M230 112 L430 112"/>
  <path class="edge" d="M230 252 C305 252 330 145 430 125"/>

  <path class="edge" d="M230 252 C310 252 335 317 430 317"/>
  <path class="edge" d="M230 392 C305 392 335 330 430 330"/>

  <path class="edge" d="M230 112 C320 112 300 487 430 487"/>
  <path class="edge" d="M550 354 L550 450"/>

  <path class="edge" d="M670 487 L820 487"/>
  <path class="edge" d="M230 532 C360 590 700 575 820 500"/>

  <path class="edge" d="M655 516 C730 548 745 657 820 657"/>
  <path class="edge" d="M230 672 C430 672 600 657 820 657"/>

  <!-- Shared inputs and saved forward values. -->
  <rect x="40" y="80" width="190" height="64" rx="6" class="large"/>
  <text x="135" y="107" class="label">P (saved)</text>
  <text x="135" y="130" class="shape">Nq x Nk</text>

  <rect x="40" y="220" width="190" height="64" rx="6" class="source"/>
  <text x="135" y="247" class="label">upstream dO</text>
  <text x="135" y="270" class="shape">Nq x d</text>

  <rect x="40" y="360" width="190" height="64" rx="6" class="source"/>
  <text x="135" y="387" class="label">V</text>
  <text x="135" y="410" class="shape">Nk x d</text>

  <rect x="40" y="500" width="190" height="64" rx="6" class="source"/>
  <text x="135" y="527" class="label">K</text>
  <text x="135" y="550" class="shape">Nk x d</text>

  <rect x="40" y="640" width="190" height="64" rx="6" class="source"/>
  <text x="135" y="667" class="label">Q</text>
  <text x="135" y="690" class="shape">Nq x d</text>

  <!-- Intermediate and output gradients. -->
  <rect x="430" y="75" width="240" height="74" rx="6" class="output"/>
  <text x="550" y="106" class="label">dV = P^T dO</text>
  <text x="550" y="132" class="shape">Nk x d</text>

  <rect x="430" y="280" width="240" height="74" rx="6" class="large"/>
  <text x="550" y="311" class="label">dP = dO V^T</text>
  <text x="550" y="337" class="shape">Nq x Nk</text>

  <rect x="430" y="450" width="240" height="74" rx="6" class="large"/>
  <text x="550" y="481" class="label">dS = softmax_vjp(P, dP)</text>
  <text x="550" y="507" class="shape">Nq x Nk</text>

  <rect x="820" y="450" width="220" height="74" rx="6" class="output"/>
  <text x="930" y="481" class="label">dQ = dS K / sqrt(d)</text>
  <text x="930" y="507" class="shape">Nq x d</text>

  <rect x="820" y="620" width="220" height="74" rx="6" class="output"/>
  <text x="930" y="651" class="label">dK = dS^T Q / sqrt(d)</text>
  <text x="930" y="677" class="shape">Nk x d</text>

  <!-- Legend. -->
  <rect x="430" y="714" width="18" height="18" rx="3" class="source"/>
  <text x="458" y="728" class="legend">saved/input tensor</text>
  <rect x="610" y="714" width="18" height="18" rx="3" class="large"/>
  <text x="638" y="728" class="legend">Nq x Nk tensor</text>
  <rect x="790" y="714" width="18" height="18" rx="3" class="output"/>
  <text x="818" y="728" class="legend">requested gradient</text>
</svg>

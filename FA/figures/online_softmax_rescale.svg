<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="osa" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">online softmax 的直觉：换指数基准时，旧状态整体缩放一次</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#64748b">公式见正文 §2.2；此图只给「基准平移 + α 重标定」的几何直觉</text>

  <!-- stage 1: old block seen -->
  <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">已处理若干 key tile</text>
  <rect x="40" y="104" width="220" height="92" rx="10" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="150" y="130" text-anchor="middle" font-size="12.5" fill="#334155">运行状态（以旧基准 m₍old₎ 记录）</text>
  <text x="150" y="156" text-anchor="middle" font-size="12.5" fill="#334155">分母 ℓ（标量）·　分子 z（向量）</text>
  <text x="150" y="180" text-anchor="middle" font-size="11.5" fill="#64748b">只存 3 个量，不存已归一化概率</text>

  <!-- new tile arrives, bigger max -->
  <rect x="300" y="104" width="200" height="92" rx="10" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="400" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">新 key tile 到来</text>
  <text x="400" y="156" text-anchor="middle" font-size="12.5" fill="#334155">带来更大的最大值</text>
  <text x="400" y="180" text-anchor="middle" font-size="12.5" fill="#b45309">m₍new₎ &gt; m₍old₎</text>

  <line x1="260" y1="150" x2="298" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#osa)"/>

  <!-- number line showing exponent base shift -->
  <text x="700" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">指数基准沿分数轴右移</text>
  <line x1="540" y1="150" x2="880" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#osa)"/>
  <text x="884" y="154" font-size="11" fill="#64748b">score</text>
  <!-- old base tick -->
  <line x1="620" y1="140" x2="620" y2="160" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="178" text-anchor="middle" font-size="12" fill="#2563eb">m₍old₎</text>
  <!-- new base tick -->
  <line x1="800" y1="138" x2="800" y2="162" stroke="#b45309" stroke-width="2.5"/>
  <text x="800" y="178" text-anchor="middle" font-size="12" fill="#b45309">m₍new₎</text>
  <!-- shift arrow -->
  <path d="M624 128 Q712 108 796 128" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#osa)"/>
  <text x="710" y="112" text-anchor="middle" font-size="11.5" fill="#dc2626">基准平移 m₍old₎→m₍new₎</text>

  <!-- rescale box -->
  <rect x="40" y="226" width="880" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="480" y="252" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">换基准 ⇒ 旧状态乘同一个缩放因子 α（一次重标定），再并入新块</text>

  <rect x="70" y="268" width="250" height="62" rx="8" fill="#fff" stroke="#fbbf24"/>
  <text x="195" y="292" text-anchor="middle" font-size="12.5" fill="#334155">旧分母 ℓ　×α</text>
  <text x="195" y="316" text-anchor="middle" font-size="12.5" fill="#334155">旧分子 z　×α（同一个 α）</text>

  <text x="360" y="304" text-anchor="middle" font-size="22" fill="#f59e0b">＋</text>

  <rect x="400" y="268" width="250" height="62" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="525" y="292" text-anchor="middle" font-size="12.5" fill="#334155">新块贡献（以 m₍new₎ 为基准）</text>
  <text x="525" y="316" text-anchor="middle" font-size="12.5" fill="#334155">并入 ℓ 与 A</text>

  <text x="690" y="304" text-anchor="middle" font-size="22" fill="#64748b">→</text>

  <rect x="730" y="268" width="160" height="62" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="810" y="292" text-anchor="middle" font-size="12.5" fill="#6b21a8">末尾一次 o = A/ℓ</text>
  <text x="810" y="316" text-anchor="middle" font-size="11.5" fill="#64748b">得与整行 softmax 相同</text>
</svg>

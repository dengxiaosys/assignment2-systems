<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="820" height="480" fill="#ffffff"/>
  <text x="410" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Causal mask 下 key tile 的三类处理</text>
  <text x="410" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">以 4×4 tile 网格为例（行 = query tile，列 = key tile），对角线为 c = r</text>

  <!-- grid -->
  <g transform="translate(150,80)">
    <!-- axis labels -->
    <text x="200" y="-14" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">key tile b →</text>
    <text x="-70" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af" transform="rotate(-90 -70 200)">query tile a →</text>

    <!-- cells 4x4; cell 100px -->
    <!-- row 0 -->
    <rect x="0" y="0" width="100" height="100" fill="#fef9c3" stroke="#64748b"/>
    <rect x="100" y="0" width="100" height="100" fill="#f3f4f6" stroke="#64748b"/>
    <rect x="200" y="0" width="100" height="100" fill="#f3f4f6" stroke="#64748b"/>
    <rect x="300" y="0" width="100" height="100" fill="#f3f4f6" stroke="#64748b"/>
    <!-- row 1 -->
    <rect x="0" y="100" width="100" height="100" fill="#dcfce7" stroke="#64748b"/>
    <rect x="100" y="100" width="100" height="100" fill="#fef9c3" stroke="#64748b"/>
    <rect x="200" y="100" width="100" height="100" fill="#f3f4f6" stroke="#64748b"/>
    <rect x="300" y="100" width="100" height="100" fill="#f3f4f6" stroke="#64748b"/>
    <!-- row 2 -->
    <rect x="0" y="200" width="100" height="100" fill="#dcfce7" stroke="#64748b"/>
    <rect x="100" y="200" width="100" height="100" fill="#dcfce7" stroke="#64748b"/>
    <rect x="200" y="200" width="100" height="100" fill="#fef9c3" stroke="#64748b"/>
    <rect x="300" y="200" width="100" height="100" fill="#f3f4f6" stroke="#64748b"/>
    <!-- row 3 -->
    <rect x="0" y="300" width="100" height="100" fill="#dcfce7" stroke="#64748b"/>
    <rect x="100" y="300" width="100" height="100" fill="#dcfce7" stroke="#64748b"/>
    <rect x="200" y="300" width="100" height="100" fill="#dcfce7" stroke="#64748b"/>
    <rect x="300" y="300" width="100" height="100" fill="#fef9c3" stroke="#64748b"/>

    <!-- diagonal -->
    <line x1="0" y1="0" x2="400" y2="400" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4"/>

    <!-- labels on representative cells -->
    <text x="50" y="54" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">对角</text>
    <text x="150" y="54" text-anchor="middle" font-size="12" fill="#6b7280">跳过</text>
    <text x="50" y="154" text-anchor="middle" font-size="12" fill="#166534" font-weight="700">全可见</text>
    <text x="350" y="354" text-anchor="middle" font-size="12" fill="#92400e" font-weight="700">对角</text>
  </g>

  <!-- legend -->
  <g transform="translate(600,110)">
    <rect x="0" y="0" width="26" height="20" fill="#dcfce7" stroke="#64748b"/>
    <text x="34" y="15" font-size="12.5" fill="#166534" font-weight="700">全可见 (k₁ ≤ q₀)</text>
    <text x="0" y="38" font-size="11.5" fill="#475569">直接计算，免逐元素 mask</text>

    <rect x="0" y="60" width="26" height="20" fill="#fef9c3" stroke="#64748b"/>
    <text x="34" y="75" font-size="12.5" fill="#92400e" font-weight="700">部分可见 (对角)</text>
    <text x="0" y="98" font-size="11.5" fill="#475569">构造 Bq×Bk 逐元素 mask</text>

    <rect x="0" y="120" width="26" height="20" fill="#f3f4f6" stroke="#64748b"/>
    <text x="34" y="135" font-size="12.5" fill="#6b7280" font-weight="700">全不可见 (k₀ &gt; q₁)</text>
    <text x="0" y="158" font-size="11.5" fill="#475569">整块跳过，连 score 都不算</text>

    <rect x="0" y="186" width="200" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="100" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">为何能跳过？</text>
    <text x="12" y="230" font-size="11.5" fill="#7f1d1d">全不可见 tile 更新为恒等：</text>
    <text x="12" y="250" font-size="11.5" fill="#7f1d1d">α=1, P̃=0 → m,ℓ,A 不变</text>
    <text x="12" y="270" font-size="11.5" fill="#7f1d1d">并规避 −∞−(−∞) 的 NaN</text>
  </g>
</svg>

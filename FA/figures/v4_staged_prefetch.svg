<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="360" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">V4 分阶段预取：用双 buffer 重叠搬运与计算（Pascal 无 cp.async）</text>

  <!-- timeline lanes -->
  <text x="40" y="86" font-size="12.5" font-weight="700" fill="#334155">计算</text>
  <text x="40" y="152" font-size="12.5" font-weight="700" fill="#334155">加载 (寄存器 fragment)</text>
  <text x="40" y="218" font-size="12.5" font-weight="700" fill="#334155">shared buffer</text>

  <!-- time axis -->
  <line x1="210" y1="248" x2="890" y2="248" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a6)"/>
  <text x="890" y="268" text-anchor="end" font-size="11.5" fill="#64748b">时间 →</text>

  <!-- compute blocks (stage s) -->
  <rect x="210" y="64" width="150" height="34" rx="5" fill="#22c55e"/><text x="285" y="86" text-anchor="middle" font-size="11.5" fill="#fff">计算 stage s</text>
  <rect x="380" y="64" width="150" height="34" rx="5" fill="#22c55e"/><text x="455" y="86" text-anchor="middle" font-size="11.5" fill="#fff">计算 stage s+1</text>
  <rect x="550" y="64" width="150" height="34" rx="5" fill="#22c55e"/><text x="625" y="86" text-anchor="middle" font-size="11.5" fill="#fff">计算 stage s+2</text>

  <!-- load blocks (prefetch next during current compute) -->
  <rect x="210" y="130" width="150" height="34" rx="5" fill="#f59e0b" opacity="0.9"/><text x="285" y="152" text-anchor="middle" font-size="11.5" fill="#fff">预取 s+1</text>
  <rect x="380" y="130" width="150" height="34" rx="5" fill="#f59e0b" opacity="0.9"/><text x="455" y="152" text-anchor="middle" font-size="11.5" fill="#fff">预取 s+2</text>
  <rect x="550" y="130" width="150" height="34" rx="5" fill="#f59e0b" opacity="0.9"/><text x="625" y="152" text-anchor="middle" font-size="11.5" fill="#fff">预取 s+3</text>

  <!-- shared double buffer -->
  <rect x="210" y="196" width="150" height="34" rx="5" fill="#60a5fa"/><text x="285" y="218" text-anchor="middle" font-size="11.5" fill="#fff">buffer A (读)</text>
  <rect x="380" y="196" width="150" height="34" rx="5" fill="#3b82f6"/><text x="455" y="218" text-anchor="middle" font-size="11.5" fill="#fff">buffer B (读)</text>
  <rect x="550" y="196" width="150" height="34" rx="5" fill="#60a5fa"/><text x="625" y="218" text-anchor="middle" font-size="11.5" fill="#fff">buffer A (读)</text>

  <!-- overlap arrows: prefetch feeds next compute -->
  <path d="M285 130 L435 100" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a6)"/>
  <path d="M455 130 L605 100" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a6)"/>
  <text x="470" y="124" font-size="10.5" fill="#dc2626">当前计算期间加载好下一 stage</text>

  <!-- barrier markers -->
  <line x1="370" y1="58" x2="370" y2="236" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <line x1="540" y1="58" x2="540" y2="236" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="3 3"/>
  <text x="370" y="52" text-anchor="middle" font-size="10" fill="#7c3aed">CTA 屏障</text>
  <text x="540" y="52" text-anchor="middle" font-size="10" fill="#7c3aed">CTA 屏障</text>

  <!-- notes -->
  <rect x="210" y="286" width="680" height="56" rx="8" fill="#f0fdfa" stroke="#2dd4bf"/>
  <text x="226" y="308" font-size="12" fill="#0f766e">· 普通 global load + 两套 shared buffer 轮换；屏障同时结束旧 stage 读取并发布新 stage</text>
  <text x="226" y="330" font-size="12" fill="#0f766e">· 配合 float4 (LDG.128) 向量搬运与 P 置换 → 32.9 ms，首次主形状超过 PyTorch efficient (1.098×)</text>
</svg>

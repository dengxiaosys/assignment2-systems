<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1180" height="440" fill="#ffffff"/>
<text x="590" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">实现演进 v0 → v5 的单次 forward 延迟（主形状 N=16384, d=64, FP32, non-causal）</text>
<text x="590" y="52" text-anchor="middle" font-size="12" fill="#64748b">GTX 1060；横轴为 log10(毫秒)；跨版本取自不同轮次，比值示意量级；efficient 为同轮对照</text>
<line x1="150.0" y1="90" x2="150.0" y2="372" stroke="#eef2f7" stroke-width="1"/>
<text x="150.0" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">10</text>
<line x1="261.9" y1="90" x2="261.9" y2="372" stroke="#eef2f7" stroke-width="1"/>
<text x="261.9" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">30</text>
<line x1="384.4" y1="90" x2="384.4" y2="372" stroke="#eef2f7" stroke-width="1"/>
<text x="384.4" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">100</text>
<line x1="496.3" y1="90" x2="496.3" y2="372" stroke="#eef2f7" stroke-width="1"/>
<text x="496.3" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">300</text>
<line x1="618.9" y1="90" x2="618.9" y2="372" stroke="#eef2f7" stroke-width="1"/>
<text x="618.9" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">1000</text>
<line x1="730.7" y1="90" x2="730.7" y2="372" stroke="#eef2f7" stroke-width="1"/>
<text x="730.7" y="388" text-anchor="middle" font-size="10" fill="#94a3b8">3000</text>
<text x="760" y="388" text-anchor="end" font-size="10" fill="#94a3b8">ms</text>
<line x1="280.4" y1="90" x2="280.4" y2="372" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="280.4" y="84" text-anchor="middle" font-size="10.5" fill="#7c3aed" font-weight="700">efficient ≈36 ms</text>
<text x="140" y="116" text-anchor="end" font-size="13" font-weight="700" fill="#ef4444">v0</text>
<rect x="150" y="96" width="578.0" height="30" rx="4" fill="#ef4444"/>
<text x="158" y="116" font-size="11.5" fill="#fff">1 query/CTA · 树形归约 · 逐 key online softmax</text>
<text x="720.0" y="116" text-anchor="end" font-size="12" font-weight="700" fill="#fff">2922.3 ms</text>
<text x="140" y="160" text-anchor="end" font-size="13" font-weight="700" fill="#f97316">v1</text>
<rect x="150" y="140" width="361.4" height="30" rx="4" fill="#f97316"/>
<text x="158" y="160" font-size="11.5" fill="#fff">1 warp/query · warp shuffle 归约（删 CTA 屏障）</text>
<text x="503.4" y="160" text-anchor="end" font-size="12" font-weight="700" fill="#fff">348.18 ms</text>
<text x="140" y="204" text-anchor="end" font-size="13" font-weight="700" fill="#f59e0b">v2</text>
<rect x="150" y="184" width="271.2" height="30" rx="4" fill="#f59e0b"/>
<text x="429.2" y="204" font-size="12" font-weight="700" fill="#f59e0b">143.56 ms</text>
<text x="499.2" y="204" font-size="11.5" fill="#475569">8 query/CTA 共享 32-key tile · 分块 softmax</text>
<text x="140" y="248" text-anchor="end" font-size="13" font-weight="700" fill="#eab308">v3</text>
<rect x="150" y="228" width="158.6" height="30" rx="4" fill="#eab308"/>
<text x="316.6" y="248" font-size="12" font-weight="700" fill="#eab308">47.46 ms</text>
<text x="386.6" y="248" font-size="11.5" fill="#475569">64 query/CTA · 4×4 寄存器微矩阵 · 受控展开</text>
<text x="140" y="292" text-anchor="end" font-size="13" font-weight="700" fill="#22c55e">v4</text>
<rect x="150" y="272" width="121.2" height="30" rx="4" fill="#22c55e"/>
<text x="279.2" y="292" font-size="12" font-weight="700" fill="#22c55e">32.89 ms</text>
<text x="349.2" y="292" font-size="11.5" fill="#475569">64×64 tile · stage8 预取 · float4 搬运</text>
<text x="140" y="336" text-anchor="end" font-size="13" font-weight="700" fill="#3b82f6">v5</text>
<rect x="150" y="316" width="78.5" height="30" rx="4" fill="#3b82f6"/>
<text x="236.5" y="336" font-size="12" font-weight="700" fill="#3b82f6">21.63 ms</text>
<text x="306.5" y="336" font-size="11.5" fill="#475569">128×64 · 8×8 外积 · 固定基准 + split</text>
<text x="140" y="380" text-anchor="end" font-size="12.5" font-weight="700" fill="#64748b">eff</text>
<rect x="150" y="360" width="130.4" height="30" rx="4" fill="#cbd5e1"/>
<text x="288.4" y="380" font-size="12" font-weight="700" fill="#64748b">≈36.0 ms</text>
<text x="358.4" y="380" font-size="11.5" fill="#475569">PyTorch memory-efficient（CUTLASS FP32 FMHA，同轮对照）</text>
<text x="150" y="418" font-size="12.5" fill="#0f172a">v0 → v5 净比值约 <tspan font-weight="700" fill="#2563eb">135×</tspan>；v4、v5 柱长已短于紫色虚线（efficient），即快于该生产级后端。</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="960" height="480" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">实现演进 v0 → v5（主形状 N=16384, d=64, FP32, non-causal）</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#64748b">GTX 1060；跨版本取自不同测量轮次，比值用于呈现量级；同轮 efficient ≈ 36 ms</text>

  <!-- log-scale latency bars. Use fixed widths encoding log10(ms). base x=120, right 900 -->
  <!-- v0 2922 -->
  <g transform="translate(0,80)">
    <text x="112" y="18" text-anchor="end" font-size="13" font-weight="700" fill="#dc2626">v0</text>
    <rect x="120" y="4" width="760" height="22" rx="4" fill="#ef4444"/>
    <text x="128" y="20" font-size="12" fill="#fff">1 query/CTA · 128 线程树形归约 · 逐 key online softmax</text>
    <text x="890" y="20" text-anchor="end" font-size="12.5" font-weight="700" fill="#fff">2922.3 ms</text>
  </g>
  <!-- v1 348 -->
  <g transform="translate(0,118)">
    <text x="112" y="18" text-anchor="end" font-size="13" font-weight="700" fill="#ea580c">v1</text>
    <rect x="120" y="4" width="560" height="22" rx="4" fill="#f97316"/>
    <text x="128" y="20" font-size="12" fill="#fff">1 warp/query · 4 query/CTA · warp shuffle 归约（删 CTA 屏障）</text>
    <text x="690" y="20" font-size="12.5" font-weight="700" fill="#ea580c">348.2 ms  (8.39×)</text>
  </g>
  <!-- v2 143 -->
  <g transform="translate(0,156)">
    <text x="112" y="18" text-anchor="end" font-size="13" font-weight="700" fill="#d97706">v2</text>
    <rect x="120" y="4" width="470" height="22" rx="4" fill="#f59e0b"/>
    <text x="128" y="20" font-size="12" fill="#fff">8 query/CTA 共享 32-key tile · 分块 softmax</text>
    <text x="600" y="20" font-size="12.5" font-weight="700" fill="#d97706">143.6 ms  (2.43×)</text>
  </g>
  <!-- v3 47 -->
  <g transform="translate(0,194)">
    <text x="112" y="18" text-anchor="end" font-size="13" font-weight="700" fill="#ca8a04">v3</text>
    <rect x="120" y="4" width="360" height="22" rx="4" fill="#eab308"/>
    <text x="128" y="20" font-size="12" fill="#fff">64 query/CTA · 4×4 寄存器微矩阵 · 受控展开</text>
    <text x="490" y="20" font-size="12.5" font-weight="700" fill="#ca8a04">47.5 ms  (3.03×)</text>
  </g>
  <!-- v4 32.9 -->
  <g transform="translate(0,232)">
    <text x="112" y="18" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">v4</text>
    <rect x="120" y="4" width="320" height="22" rx="4" fill="#22c55e"/>
    <text x="128" y="20" font-size="12" fill="#fff">64×64 SIMT tile · stage8 预取 · float4 搬运</text>
    <text x="450" y="20" font-size="12.5" font-weight="700" fill="#16a34a">32.9 ms  (1.44×)</text>
  </g>
  <!-- v5 21.6 -->
  <g transform="translate(0,270)">
    <text x="112" y="18" text-anchor="end" font-size="13" font-weight="700" fill="#2563eb">v5</text>
    <rect x="120" y="4" width="270" height="22" rx="4" fill="#3b82f6"/>
    <text x="128" y="20" font-size="12" fill="#fff">128×64 · 8×8 外积 · 固定基准 + split</text>
    <text x="400" y="20" font-size="12.5" font-weight="700" fill="#2563eb">21.6 ms  (1.52×)</text>
  </g>

  <!-- efficient reference line -->
  <line x1="402" y1="78" x2="402" y2="300" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="402" y="314" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">PyTorch efficient ≈ 36 ms</text>

  <!-- bottom: optimization theme flow -->
  <text x="40" y="356" font-size="13" font-weight="700" fill="#0f172a">优化主线（每步可独立测量）</text>
  <g transform="translate(0,370)">
    <rect x="40" y="0" width="128" height="56" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="104" y="24" text-anchor="middle" font-size="11.5" fill="#1e40af">通信降到 warp</text>
    <text x="104" y="42" text-anchor="middle" font-size="10.5" fill="#64748b">shuffle 归约</text>

    <rect x="196" y="0" width="128" height="56" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="260" y="24" text-anchor="middle" font-size="11.5" fill="#166534">共享 + 分块</text>
    <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#64748b">K/V tile·tile softmax</text>

    <rect x="352" y="0" width="128" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="416" y="24" text-anchor="middle" font-size="11.5" fill="#92400e">寄存器微矩阵</text>
    <text x="416" y="42" text-anchor="middle" font-size="10.5" fill="#64748b">操作数复用</text>

    <rect x="508" y="0" width="128" height="56" rx="8" fill="#f0fdfa" stroke="#2dd4bf"/>
    <text x="572" y="24" text-anchor="middle" font-size="11.5" fill="#0f766e">预取 + 向量化</text>
    <text x="572" y="42" text-anchor="middle" font-size="10.5" fill="#64748b">掩盖访存延迟</text>

    <rect x="664" y="0" width="128" height="56" rx="8" fill="#faf5ff" stroke="#a855f7"/>
    <text x="728" y="24" text-anchor="middle" font-size="11.5" fill="#6b21a8">固定基准</text>
    <text x="728" y="42" text-anchor="middle" font-size="10.5" fill="#64748b">split 线性归并</text>

    <line x1="168" y1="28" x2="194" y2="28" stroke="#64748b" stroke-width="1.5" marker-end="url(#a5)"/>
    <line x1="324" y1="28" x2="350" y2="28" stroke="#64748b" stroke-width="1.5" marker-end="url(#a5)"/>
    <line x1="480" y1="28" x2="506" y2="28" stroke="#64748b" stroke-width="1.5" marker-end="url(#a5)"/>
    <line x1="636" y1="28" x2="662" y2="28" stroke="#64748b" stroke-width="1.5" marker-end="url(#a5)"/>
  </g>
  <text x="840" y="404" font-size="11.5" fill="#64748b">净比值</text>
  <text x="840" y="422" font-size="15" font-weight="700" fill="#2563eb">≈ 135×</text>
</svg>

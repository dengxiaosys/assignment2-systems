<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">朴素 attention 与 FlashAttention 的数据流与 HBM I/O 对比</text>

  <!-- Left panel: naive -->
  <rect x="24" y="52" width="440" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="244" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">朴素实现：完整 S、P 往返 HBM</text>

  <!-- HBM band left -->
  <rect x="48" y="96" width="392" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="60" y="118" font-size="12" font-weight="700" fill="#374151">HBM</text>
  <rect x="70" y="124" width="52" height="26" rx="4" fill="#3b82f6"/><text x="96" y="141" text-anchor="middle" font-size="12" fill="#fff">Q</text>
  <rect x="128" y="124" width="52" height="26" rx="4" fill="#10b981"/><text x="154" y="141" text-anchor="middle" font-size="12" fill="#fff">K</text>
  <rect x="186" y="124" width="52" height="26" rx="4" fill="#f59e0b"/><text x="212" y="141" text-anchor="middle" font-size="12" fill="#fff">V</text>
  <rect x="268" y="124" width="74" height="26" rx="4" fill="#ef4444"/><text x="305" y="141" text-anchor="middle" font-size="11" fill="#fff">S (N×N)</text>
  <rect x="350" y="124" width="74" height="26" rx="4" fill="#ef4444"/><text x="387" y="141" text-anchor="middle" font-size="11" fill="#fff">P (N×N)</text>

  <!-- compute box -->
  <rect x="90" y="208" width="308" height="104" rx="8" fill="#fff" stroke="#94a3b8"/>
  <text x="244" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155">GPU 计算</text>
  <text x="244" y="254" text-anchor="middle" font-size="12" fill="#475569">S = QKᵀ/√d  →  写回 HBM</text>
  <text x="244" y="275" text-anchor="middle" font-size="12" fill="#475569">读回 S → P = softmax(S) → 写回</text>
  <text x="244" y="296" text-anchor="middle" font-size="12" fill="#475569">读回 P → O = PV</text>

  <!-- arrows naive -->
  <line x1="305" y1="156" x2="260" y2="206" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <line x1="230" y1="208" x2="300" y2="158" stroke="#dc2626" stroke-width="2" marker-end="url(#arRed)"/>
  <text x="150" y="190" font-size="11" fill="#dc2626" font-weight="700">反复写回 / 读入 O(N²)</text>

  <rect x="90" y="330" width="308" height="40" rx="6" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="244" y="355" text-anchor="middle" font-size="12" fill="#991b1b">中间存储 O(N²) · HBM I/O 被 S、P 往返主导</text>

  <!-- Right panel: flash -->
  <rect x="496" y="52" width="440" height="340" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="716" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">FlashAttention：tile 在片上生成消费</text>

  <rect x="520" y="96" width="392" height="60" rx="6" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="532" y="118" font-size="12" font-weight="700" fill="#374151">HBM</text>
  <rect x="548" y="124" width="46" height="26" rx="4" fill="#3b82f6"/><text x="571" y="141" text-anchor="middle" font-size="12" fill="#fff">Q</text>
  <rect x="600" y="124" width="46" height="26" rx="4" fill="#10b981"/><text x="623" y="141" text-anchor="middle" font-size="12" fill="#fff">K</text>
  <rect x="652" y="124" width="46" height="26" rx="4" fill="#f59e0b"/><text x="675" y="141" text-anchor="middle" font-size="12" fill="#fff">V</text>
  <rect x="800" y="124" width="46" height="26" rx="4" fill="#8b5cf6"/><text x="823" y="141" text-anchor="middle" font-size="12" fill="#fff">O</text>
  <rect x="852" y="124" width="46" height="26" rx="4" fill="#64748b"/><text x="875" y="141" text-anchor="middle" font-size="12" fill="#fff">L</text>

  <!-- on-chip box -->
  <rect x="560" y="200" width="312" height="118" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="716" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e">片上 (SRAM / 寄存器)</text>
  <rect x="586" y="236" width="60" height="26" rx="4" fill="#3b82f6" opacity="0.85"/><text x="616" y="253" text-anchor="middle" font-size="11" fill="#fff">Q tile</text>
  <rect x="654" y="236" width="60" height="26" rx="4" fill="#10b981" opacity="0.85"/><text x="684" y="253" text-anchor="middle" font-size="11" fill="#fff">K tile</text>
  <rect x="722" y="236" width="60" height="26" rx="4" fill="#f59e0b" opacity="0.85"/><text x="752" y="253" text-anchor="middle" font-size="11" fill="#fff">V tile</text>
  <rect x="790" y="236" width="60" height="26" rx="4" fill="#ef4444" opacity="0.6" stroke="#dc2626" stroke-dasharray="3 2"/><text x="820" y="253" text-anchor="middle" font-size="10" fill="#fff">S/P tile</text>
  <text x="716" y="284" text-anchor="middle" font-size="11.5" fill="#92400e">online softmax 维护 m, ℓ, z</text>
  <text x="716" y="303" text-anchor="middle" font-size="11.5" fill="#92400e">S/P tile 消费后即丢弃 (不入 HBM)</text>

  <!-- arrows flash -->
  <line x1="620" y1="156" x2="640" y2="234" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="760" y1="262" x2="815" y2="156" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ar)"/>
  <text x="792" y="200" font-size="11" fill="#7c3aed" font-weight="700">仅写 O、L</text>

  <rect x="560" y="332" width="312" height="40" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="716" y="357" text-anchor="middle" font-size="12" fill="#166534">中间存储 O(Nd) · 不物化完整 S、P</text>
</svg>
